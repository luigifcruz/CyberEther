  - name: nr_cell_table
    module: note
    device: cpu
    runtime: native
    provider: generic
    config:
      content: |-
        # 5G NR Cell Scanner via Pluto (network stream)
        Pluto IQ arrives over TCP on port **5001** (CI16), no driver needed. Scanner looks for SSB PSS/SSS at **${env.nrscan.center_mhz} MHz** and the -100/0/+100 kHz raster neighbours. Buffers ${env.nrscan.buffers}, cells ${env.nrscan.cells_seen}, best PSS metric ${env.nrscan.best_metric}.
        
        **Start the stream on the Pluto** (`ssh root@192.168.50.25` with the Pluto's default login; replace HOST with this PC's IP):
        ```
        iio_attr -c -o ad9361-phy altvoltage0 frequency 634950000
        iio_attr -c -i ad9361-phy voltage0 sampling_frequency 3840000
        iio_attr -c -i ad9361-phy voltage0 rf_bandwidth 3600000
        iio_attr -c -i ad9361-phy voltage0 gain_control_mode slow_attack
        iio_readdev -b 65536 cf-ad9361-lpc | nc HOST 5001
        ```
        If the link cannot sustain 15 MB/s, use 1920000 for the sample rate, set **pluto_stream** Samples to 9600, and `FS = 1.92e6` in nr_cell_scanner.
        
        **Finding the SSB:** step the LO across the n71 GSCN points 618.15, 619.35, ... 651.75 MHz (1.2 MHz steps) and update `CENTER_HZ` in nr_cell_scanner to match. An SSB shows in the waterfall as a 3.6 MHz-wide burst every 20 ms; the table fills once PSS/SSS lock.
        
        | PCI | NID1 | NID2 | Hits | SSB MHz | PSS dBFS | Metric | SSS q | CFO Hz | Timing us | Last |
        |--:|--:|--:|--:|--:|--:|--:|--:|--:|--:|---|
        | ${env.nrscan.cells[*].pci} | ${env.nrscan.cells[*].nid1} | ${env.nrscan.cells[*].nid2} | ${env.nrscan.cells[*].hits} | ${env.nrscan.cells[*].ssb} | ${env.nrscan.cells[*].power} | ${env.nrscan.cells[*].metric} | ${env.nrscan.cells[*].sss_q} | ${env.nrscan.cells[*].cfo} | ${env.nrscan.cells[*].timing} | ${env.nrscan.cells[*].last} |
    meta:
      node:
        x: 2680
        y: 3480
        width: 1000
        height: 640
  - name: pluto_iiod
    module: python
    device: cpu
    runtime: python
    provider: generic
    config:
      source: editor
      code: |
        import socket
        import time
        import numpy as np
        
        # libiio network (iiod) client for the SignalLens Pro / Pluto at 192.168.50.25:30431.
        # Configures the AD9361 and streams RX1 IQ into the graph. Edit and press Done to retune.
        
        HOST = "192.168.50.25"
        PORT = 30431
        CENTER_HZ = 639.75e6        # RX LO (n71 GSCN point)
        FS = 3.84e6                 # sample rate; keep in step with FS in nr_cell_scanner
        RF_BW_HZ = 3.6e6
        GAIN_MODE = "manual"        # slow_attack, fast_attack, or manual
        MANUAL_GAIN_DB = 60
        RX_PORT = "A_BALANCED"      # only A_BALANCED exists on this hardware (B/C rejected with -22)
        DEV = "cf-ad9361-lpc"
        PHY = "ad9361-phy"
        BATCHES, SAMPLES = 2, 19200
        NSAMP = BATCHES * SAMPLES
        NBYTES = NSAMP * 4          # two int16 per sample
        
        sock = None
        stats = dict(buffers=0, mbytes=0.0, errors=0, connects=0, last_error="", state="idle", mask="")
        last_publish = 0.0
        last_rate_t = 0.0
        last_rate_bytes = 0.0
        rate_mbps = 0.0
        
        
        def _line():
            data = bytearray()
            while not data.endswith(b"\n"):
                c = sock.recv(1)
                if not c:
                    raise ConnectionError("connection closed")
                data += c
            return bytes(data).strip().decode("ascii", "replace")
        
        
        def _recv_exact(n):
            out = bytearray()
            while len(out) < n:
                chunk = sock.recv(min(65536, n - len(out)))
                if not chunk:
                    raise ConnectionError("connection closed mid-buffer")
                out += chunk
            return bytes(out)
        
        
        def _cmd(text):
            sock.sendall((text + "\r\n").encode())
            return int(_line())
        
        
        def _write_attr(dev, direction, chan, attr, value):
            payload = (str(value) + "\0").encode()
            chan_part = "%s %s " % (direction, chan) if chan else ""
            sock.sendall(("WRITE %s %s%s %d\r\n" % (dev, chan_part, attr, len(payload))).encode() + payload)
            ret = int(_line())
            if ret < 0:
                raise RuntimeError("WRITE %s %s = %s failed (%d)" % (chan or dev, attr, value, ret))
            return ret
        
        
        def _connect():
            global sock
            s = socket.create_connection((HOST, PORT), timeout=5.0)
            s.settimeout(5.0)
            s.setsockopt(socket.IPPROTO_TCP, socket.TCP_NODELAY, 1)
            sock = s
            _cmd("TIMEOUT 3000")
            _write_attr(PHY, "OUTPUT", "altvoltage0", "frequency", int(CENTER_HZ))
            _write_attr(PHY, "INPUT", "voltage0", "sampling_frequency", int(FS))
            _write_attr(PHY, "INPUT", "voltage0", "rf_bandwidth", int(RF_BW_HZ))
            _write_attr(PHY, "INPUT", "voltage0", "gain_control_mode", GAIN_MODE)
            _write_attr(PHY, "INPUT", "voltage0", "rf_port_select", RX_PORT)
            if GAIN_MODE == "manual":
                _write_attr(PHY, "INPUT", "voltage0", "hardwaregain", MANUAL_GAIN_DB)
            ret = _cmd("OPEN %s %d 00000003" % (DEV, NSAMP))
            if ret < 0:
                raise RuntimeError("OPEN failed (%d)" % ret)
            stats["connects"] += 1
            stats["state"] = "streaming"
        
        
        def _read_attr(s, dev, direction, chan, attr):
            chan_part = "%s %s " % (direction, chan) if chan else ""
            s.sendall(("READ %s %s%s\r\n" % (dev, chan_part, attr)).encode())
            head = b""
            while not head.strip():
                head = b""
                while not head.endswith(b"\n"):
                    c = s.recv(1)
                    if not c:
                        raise ConnectionError("closed")
                    head += c
            n = int(head.strip())
            if n <= 0:
                return "err %d" % n
            out = b""
            while len(out) < n:
                chunk = s.recv(n - len(out))
                if not chunk:
                    break
                out += chunk
            return out.rstrip(b"\0\n").decode("ascii", "replace")
        
        
        def _readback():
            """Query radio state on a separate, short-lived iiod connection so streaming is never disturbed."""
            s = None
            try:
                s = socket.create_connection((HOST, PORT), timeout=3.0)
                s.settimeout(3.0)
                stats["radio"] = {
                    "rx_lo_hz": _read_attr(s, PHY, "OUTPUT", "altvoltage0", "frequency"),
                    "fs_hz": _read_attr(s, PHY, "INPUT", "voltage0", "sampling_frequency"),
                    "rf_bw_hz": _read_attr(s, PHY, "INPUT", "voltage0", "rf_bandwidth"),
                    "gain_mode": _read_attr(s, PHY, "INPUT", "voltage0", "gain_control_mode"),
                    "hardwaregain": _read_attr(s, PHY, "INPUT", "voltage0", "hardwaregain"),
                    "rssi": _read_attr(s, PHY, "INPUT", "voltage0", "rssi"),
                    "rx_port": _read_attr(s, PHY, "INPUT", "voltage0", "rf_port_select"),
                    "bist_prbs": _read_attr(s, PHY, "", "", "bist_prbs"),
                    "loopback": _read_attr(s, PHY, "", "", "loopback"),
                }
            except Exception as e:
                stats["radio"] = {"error": str(e)}
            finally:
                if s is not None:
                    try:
                        s.close()
                    except Exception:
                        pass
        
        
        def _close():
            global sock
            if sock is not None:
                try:
                    sock.sendall(("CLOSE %s\r\n" % DEV).encode())
                except Exception:
                    pass
                try:
                    sock.close()
                except Exception:
                    pass
            sock = None
            stats["state"] = "disconnected"
        
        
        def _read_buffer():
            sock.sendall(("READBUF %s %d\r\n" % (DEV, NBYTES)).encode())
            out = bytearray()
            while len(out) < NBYTES:
                n = int(_line())
                if n < 0:
                    raise RuntimeError("READBUF error (%d)" % n)
                if n == 0:
                    break
                stats["mask"] = _line()
                out += _recv_exact(n)
            return bytes(out)
        
        
        def _publish(ctx, now):
            global last_publish
            if now - last_publish < 0.5:
                return
            last_publish = now
            ctx.env["pluto"] = {
                "host": "%s:%d" % (HOST, PORT), "state": stats["state"], "center_hz": float(CENTER_HZ),
                "center_mhz": round(CENTER_HZ / 1e6, 3), "fs": float(FS), "gain": GAIN_MODE,
                "buffers": stats["buffers"], "mb_received": round(stats["mbytes"], 1),
                "rate_mbps": round(rate_mbps, 1), "connects": stats["connects"], "errors": stats["errors"],
                "last_error": stats["last_error"], "mask": stats["mask"],
                "radio": stats.get("radio", {}),
                "psd_16_dbfs": stats.get("psd_16_dbfs", []),
                "samples": {k: stats.get(k, "--") for k in ("i_min", "i_max", "q_min", "q_max", "rms", "zero_frac", "head_hex")},
            }
        
        
        def compute(ctx):
            global last_rate_t, last_rate_bytes, rate_mbps
            now = time.time()
            if sock is None:
                try:
                    _connect()
                except Exception as e:
                    stats["errors"] += 1
                    stats["last_error"] = "connect: %s" % e
                    stats["state"] = "retrying"
                    _close()
                    _publish(ctx, now)
                    return YIELD(2.0)
            try:
                data = _read_buffer()
            except Exception as e:
                stats["errors"] += 1
                stats["last_error"] = "read: %s" % e
                _close()
                _publish(ctx, now)
                return YIELD(1.0)
            if len(data) < NBYTES:
                return SKIP
            iq = np.frombuffer(data, dtype="<i2").astype(np.float32).reshape(-1, 2)
            x = (iq[:, 0] + 1j * iq[:, 1]) / 2048.0
            stats["i_min"] = int(iq[:, 0].min()); stats["i_max"] = int(iq[:, 0].max())
            stats["q_min"] = int(iq[:, 1].min()); stats["q_max"] = int(iq[:, 1].max())
            stats["rms"] = round(float(np.sqrt(np.mean(np.abs(x) ** 2))), 5)
            stats["zero_frac"] = round(float(np.mean((iq[:, 0] == 0) & (iq[:, 1] == 0))), 3)
            stats["head_hex"] = data[:16].hex()
            spec = np.abs(np.fft.fftshift(np.fft.fft(x[:16384]))) ** 2 / 16384.0 ** 2
            bands = 10.0 * np.log10(spec.reshape(16, -1).mean(axis=1) + 1e-20)
            stats["psd_16_dbfs"] = [round(float(v), 1) for v in bands]
            ctx.outputs[0][...] = x.reshape(BATCHES, SAMPLES).astype(np.complex64)
            ctx.output_attrs[0]["frequency"] = np.float32(CENTER_HZ)
            ctx.output_attrs[0]["sampleRate"] = np.float32(FS)
            stats["buffers"] += 1
            stats["mbytes"] += NBYTES / 1e6
            if stats["buffers"] % 100 == 0:
                _readback()
            if now - last_rate_t >= 1.0:
                if last_rate_t:
                    rate_mbps = 8.0 * (stats["mbytes"] - last_rate_bytes) / (now - last_rate_t)
                last_rate_t = now
                last_rate_bytes = stats["mbytes"]
            _publish(ctx, now)
        
        
        def cleanup():
            _close()
      file: ''
      inputCount: 0
      outputCount: 1
      outputTensorSpecs:
        - shape: '[2, 19200]'
          axes: '[B, S]'
          dtype: CF32
          device: cpu
      throttled: false
    meta:
      node:
        x: 0
        y: 3480
        width: 300
        height: 400
  - name: nr_cell_scanner
    module: python
    device: cpu
    runtime: python
    provider: generic
    config:
      source: editor
      code: |
        import time
        import numpy as np
        
        # 5G NR cell scanner (SSB case A, 15 kHz SCS) for the Pluto stream.
        # Stage 1: fractional CFO from cyclic-prefix correlation over the whole buffer.
        # Stage 2: differential frequency-domain PSS search over sliding 256-point windows, which is
        #          immune to residual CFO and timing and yields the SSB centre offset in subcarriers.
        # Stage 3: time-domain refinement at that offset, then SSS decode -> N_ID^cell = 3*NID1 + NID2.
        
        CENTER_HZ = 646.95e6      # overwritten from env.pluto.center_hz
        FS = 3.84e6
        SCS = 15e3
        NFFT = int(round(FS / SCS))
        CP = int(round(144 * FS / 30.72e6))
        SYM = NFFT + CP
        HOP = 32
        MIN_DIFF = 0.45           # differential PSS score needed (false alarms on OFDM data reach ~0.35)
        MIN_SSS_Q = 5.0
        SEEN_TTL_S = 30.0
        MAX_ROWS = 8
        MAX_SHIFT = 90            # search SSB centres within +/- 90 subcarriers (1.35 MHz)
        
        
        def _mseq127(init, taps):
            x = list(init)
            for i in range(120):
                x.append(sum(x[i + t] for t in taps) % 2)
            return np.array(x)
        
        
        XP = _mseq127([0, 1, 1, 0, 1, 1, 1], (0, 4))
        X0 = _mseq127([1, 0, 0, 0, 0, 0, 0], (0, 4))
        X1 = _mseq127([1, 0, 0, 0, 0, 0, 0], (0, 1))
        N127 = np.arange(127)
        
        
        def _pss(nid2):
            return 1.0 - 2.0 * XP[(N127 + 43 * nid2) % 127]
        
        
        def _sss(nid1, nid2):
            m0 = 15 * (nid1 // 112) + 5 * nid2
            m1 = nid1 % 112
            return (1.0 - 2.0 * X0[(N127 + m0) % 127]) * (1.0 - 2.0 * X1[(N127 + m1) % 127])
        
        
        BIN0 = NFFT // 2 - 64
        
        
        def _to_time(d):
            X = np.zeros(NFFT, dtype=np.complex128)
            X[BIN0: BIN0 + 127] = d
            return np.fft.ifft(np.fft.ifftshift(X)) * NFFT
        
        
        PSS_F = [_pss(i) for i in range(3)]
        PSS_T = [_to_time(d) for d in PSS_F]
        SSS_TABLE = {nid2: np.array([_sss(n1, nid2) for n1 in range(336)]) for nid2 in range(3)}
        NCORR = 512
        DIFF_K = []
        for _d in PSS_F:
            kern = np.zeros(NFFT - 1)
            kern[BIN0: BIN0 + 126] = _d[:-1] * _d[1:]
            DIFF_K.append(np.conj(np.fft.fft(kern, NCORR)))
        
        cells = {}
        last_publish = 0.0
        buffers = 0
        best_seen = 0.0
        last_cfo = 0.0
        tally = {}
        last_stage3 = {}
        
        
        def _subcarriers(sym):
            return np.fft.fftshift(np.fft.fft(sym))[BIN0: BIN0 + 127]
        
        
        def compute(ctx):
            global last_publish, buffers, best_seen, CENTER_HZ, last_cfo, last_stage3
            CENTER_HZ = float(ctx.env.get("pluto", {}).get("center_hz", CENTER_HZ))
            raw = np.asarray(ctx.inputs[0])
            x = raw.reshape(-1).astype(np.complex64)
            n = x.size
            buffers += 1
            now = time.time()
            tt = np.arange(n) / FS
        
            # Stage 1: fractional CFO (within +/- SCS/2) from CP correlation.
            cp_sum = np.sum(x[NFFT:] * np.conj(x[:-NFFT]))
            f_frac = float(np.angle(cp_sum) / (2.0 * np.pi) * SCS)
            last_cfo = f_frac
            x = (x * np.exp(-2j * np.pi * f_frac * tt)).astype(np.complex64)
        
            # Stage 2: differential PSS search.
            nwin = (n - NFFT) // HOP
            idx = np.arange(nwin)[:, None] * HOP + np.arange(NFFT)[None, :]
            Y = np.fft.fftshift(np.fft.fft(x[idx], axis=1), axes=1)
            Z = Y[:, :-1] * np.conj(Y[:, 1:])
            Z = Z / (np.abs(Z).sum(axis=1, keepdims=True) + 1e-12)
            ZF = np.fft.fft(Z, NCORR, axis=1)
            best = (0.0, 0, 0, 0)
            for nid2 in range(3):
                C = np.abs(np.fft.ifft(ZF * DIFF_K[nid2][None, :], axis=1))
                shifts = np.concatenate([np.arange(0, MAX_SHIFT + 1), np.arange(NCORR - MAX_SHIFT, NCORR)])
                Cs = C[:, shifts]
                w, j = np.unravel_index(int(np.argmax(Cs)), Cs.shape)
                score = float(Cs[w, j])
                if score > best[0]:
                    k0 = int(shifts[j])
                    if k0 > NCORR // 2:
                        k0 -= NCORR
                    best = (score, nid2, int(w), k0)
            score, nid2, w, k0 = best
            best_seen = max(best_seen * 0.97, score)
            if score >= MIN_DIFF:
                key = "nid2=%d shift=%+d" % (nid2, k0)
                tally[key] = tally.get(key, 0) + 1
        
            # Output: differential score per window (for the plot).
            trace = np.zeros(nwin, dtype=np.float32)
            Cbest = np.abs(np.fft.ifft(ZF * DIFF_K[nid2][None, :], axis=1))
            trace[:] = Cbest.max(axis=1)
            ctx.outputs[0][...] = np.interp(np.linspace(0, 1, 1024), np.linspace(0, 1, nwin), trace).astype(np.float32)
            ctx.outputs[1][...] = raw.reshape(ctx.outputs[1].shape)
            ctx.output_attrs[1]["frequency"] = np.float32(CENTER_HZ)
            ctx.output_attrs[1]["sampleRate"] = np.float32(FS)
        
            if score >= MIN_DIFF:
                # Stage 3: shift the SSB to DC, refine timing in the time domain, decode SSS.
                xs = (x * np.exp(-2j * np.pi * (k0 * SCS) * tt)).astype(np.complex64)
                lo = max(CP, w * HOP - 2 * HOP)
                hi = min(n - NFFT, w * HOP + 3 * HOP)
                seg = xs[lo: hi + NFFT]
                c = np.correlate(seg, PSS_T[nid2], mode="valid")
                t = lo + int(np.argmax(np.abs(c)))
                td_norm = float(np.abs(c).max() / (np.sqrt(np.sum(np.abs(xs[t: t + NFFT]) ** 2) * 127.0 * NFFT) + 1e-9))
                last_stage3 = {"td_corr": round(td_norm, 3), "t": int(t)}
                if t >= CP and t + 2 * SYM + NFFT <= n:
                    cp_corr = np.sum(xs[t - CP: t] * np.conj(xs[t - CP + NFFT: t + NFFT]))
                    cfo2 = -np.angle(cp_corr) / (2.0 * np.pi) * SCS
                    k = np.arange(-CP, 2 * SYM + NFFT)
                    blk = xs[t - CP: t + 2 * SYM + NFFT] * np.exp(-2j * np.pi * cfo2 * k / FS)
                    Ypss = _subcarriers(blk[CP: CP + NFFT])
                    Ysss = _subcarriers(blk[CP + 2 * SYM: CP + 2 * SYM + NFFT])
                    H = np.convolve(Ypss * PSS_F[nid2], np.ones(5) / 5.0, mode="same")
                    Yeq = Ysss * np.conj(H) / (np.abs(H) ** 2 + 1e-9)
                    scores = np.real(SSS_TABLE[nid2] @ Yeq)
                    nid1 = int(np.argmax(scores))
                    sss_q = float(scores.max() / (np.abs(scores).mean() + 1e-9))
                    last_stage3.update(sss_q=round(sss_q, 2), nid1=nid1, cfo2=round(float(cfo2), 1))
                    if sss_q >= MIN_SSS_Q:
                        pci = 3 * nid1 + nid2
                        power_db = float(10.0 * np.log10(np.mean(np.abs(Ypss) ** 2) / NFFT ** 2 + 1e-20))
                        c = cells.setdefault(pci, dict(pci=pci, nid1=nid1, nid2=nid2, hits=0))
                        c.update(hits=c["hits"] + 1, last=now, metric=score, sss_q=sss_q,
                                 cfo=f_frac + float(cfo2), ssb_mhz=(CENTER_HZ + k0 * SCS) / 1e6,
                                 power=power_db, timing_us=1e6 * t / FS)
        
            for pci in [p for p, c in cells.items() if now - c["last"] > SEEN_TTL_S]:
                cells.pop(pci)
        
            if now - last_publish < 0.5:
                return
            last_publish = now
            rows = sorted(cells.values(), key=lambda c: -c["hits"])[:MAX_ROWS]
            ctx.env["nrscan"] = {
                "center_mhz": round(CENTER_HZ / 1e6, 3),
                "buffers": buffers,
                "cells_seen": len(rows),
                "best_metric": round(best_seen, 3),
                "last_candidate": {"score": round(score, 3), "nid2": nid2, "shift_sc": k0, "window": w},
                "frac_cfo_hz": round(last_cfo, 1),
                "stage3": dict(last_stage3),
                "tally": dict(sorted(tally.items(), key=lambda kv: -kv[1])[:6]),
                "cells": [dict(pci=c["pci"], nid1=c["nid1"], nid2=c["nid2"], hits=c["hits"],
                               ssb="%.3f" % c["ssb_mhz"], power="%.1f" % c["power"], metric="%.2f" % c["metric"],
                               sss_q="%.1f" % c["sss_q"], cfo="%.0f" % c["cfo"], timing="%.0f" % c["timing_us"],
                               last=time.strftime("%H:%M:%S", time.localtime(c["last"]))) for c in rows],
            }
      file: ''
      inputCount: 1
      outputCount: 2
      outputTensorSpecs:
        - shape: '[1024]'
          axes: '[S]'
          dtype: F32
          device: cpu
        - shape: '[2, 19200]'
          axes: '[B, S]'
          dtype: CF32
          device: cpu
      throttled: true
    input:
      input0: '${graph.pluto_iiod.output.output0}'
    meta:
      node:
        x: 360
        y: 3480
        width: 700
        height: 400
