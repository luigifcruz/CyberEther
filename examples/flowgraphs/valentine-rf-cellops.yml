    module: python
    device: cpu
    runtime: python
    provider: generic
    config:
      source: editor
      code: |
        # Valentine RF Cellular Operations: scan controls.
        # Edit a value below and press Done; the analyzer applies it within a second.
        
        HOLD_BAND = "n71"         # Watchlist band name to hold, e.g. "B41/n41". "" resumes the sweep.
        OPEN_ALERT = 0            # Alert id whose saved FFT evidence shows in the Evidence plot. 0 = live trace.
        ACK_ALERT = 0             # Alert id to acknowledge, or "all".
        SORT_BY = "class"         # Watchlist order: class (drone bands first), peak, occupancy, noise, name, last_scan, status
        
        PEAK_ALERT_DBFS = -45.0   # Alert when a band peak rises above this level
        OCCUPANCY_ALERT = 0.60    # Alert when this fraction of a band's bins sits above the noise floor
        NOISE_RISE_ALERT_DB = 8.0 # Alert when a band's noise floor rises this far above its running baseline
        DRONE_ALERT_DB = 15.0     # Drone bands: alert when the peak rises this far above the band's baseline noise
        OCCUPANCY_MARGIN_DB = 6.0 # A bin counts as occupied this far above the band noise floor
        STALE_AFTER_S = 120.0     # A band not rescanned within this time is marked STALE
        
        
        def compute(ctx):
            ctx.env["cellops_control"] = {
                "hold_band": HOLD_BAND,
                "open_alert": OPEN_ALERT,
                "ack_alert": ACK_ALERT,
                "sort_by": SORT_BY,
                "peak_alert_dbfs": PEAK_ALERT_DBFS,
                "occupancy_alert": OCCUPANCY_ALERT,
                "noise_rise_alert_db": NOISE_RISE_ALERT_DB,
                "drone_alert_db": DRONE_ALERT_DB,
                "occupancy_margin_db": OCCUPANCY_MARGIN_DB,
                "stale_after_s": STALE_AFTER_S,
            }
            return YIELD(0.5)
      file: ''
      inputCount: 0
      outputCount: 0
      outputTensorSpecs: []
      throttled: true
