  - name: lte_cell_scanner
    module: python
    device: cpu
    runtime: python
    provider: generic
    config:
      source: editor
      code: |
        import time
        import numpy as np
        
        # LTE cell scanner: PSS/SSS detection at 1.92 MS/s (128-point symbols, 15 kHz subcarriers).
        # Reports the Physical Cell ID (PCI = 3*NID1 + NID2), timing, CFO and PSS power of every cell
        # heard on the carrier the sdr_lte block is tuned to.
        
        FS = 1.92e6
        NFFT = 128
        CP = 9
        SEEN_TTL_S = 30.0
        MIN_METRIC = 0.25       # normalised PSS correlation needed to count a detection
        MIN_SSS_Q = 6.0         # SSS peak over mean score needed to trust the NID1 decision
        MAX_ROWS = 8
        OFFSETS_HZ = (-300e3, -200e3, -100e3, 0.0, 100e3, 200e3, 300e3)   # 100 kHz raster around the tuned centre
        
        
        def _pss_freq(u):
            n = np.arange(62)
            d = np.where(n < 31, np.exp(-1j * np.pi * u * n * (n + 1) / 63.0),
                         np.exp(-1j * np.pi * u * (n + 1) * (n + 2) / 63.0))
            return d
        
        
        def _to_time(d62):
            X = np.zeros(NFFT, dtype=np.complex128)
            X[NFFT // 2 - 31: NFFT // 2] = d62[:31]
            X[NFFT // 2 + 1: NFFT // 2 + 32] = d62[31:]
            return np.fft.ifft(np.fft.ifftshift(X)) * NFFT
        
        
        def _mseq(taps):
            x = np.zeros(31, dtype=int)
            x[4] = 1
            for i in range(26):
                x[i + 5] = sum(x[i + t] for t in taps) % 2
            return 1 - 2 * x
        
        
        S_SEQ = _mseq((0, 2))
        C_SEQ = _mseq((0, 3))
        Z_SEQ = _mseq((0, 1, 2, 4))
        
        
        def _sss(nid1, nid2, subframe):
            qp = nid1 // 30
            q = (nid1 + qp * (qp + 1) // 2) // 30
            mp = nid1 + q * (q + 1) // 2
            m0 = mp % 31
            m1 = (m0 + mp // 31 + 1) % 31
            n = np.arange(31)
            s0 = S_SEQ[(n + m0) % 31]
            s1 = S_SEQ[(n + m1) % 31]
            c0 = C_SEQ[(n + nid2) % 31]
            c1 = C_SEQ[(n + nid2 + 3) % 31]
            z0 = Z_SEQ[(n + (m0 % 8)) % 31]
            z1 = Z_SEQ[(n + (m1 % 8)) % 31]
            d = np.zeros(62)
            if subframe == 0:
                d[0::2] = s0 * c0
                d[1::2] = s1 * c1 * z0
            else:
                d[0::2] = s1 * c0
                d[1::2] = s0 * c1 * z1
            return d
        
        
        PSS_U = (25, 29, 34)
        PSS_F = [_pss_freq(u) for u in PSS_U]
        PSS_T = [_to_time(d) for d in PSS_F]
        SSS_TABLE = {nid2: np.array([[_sss(n1, nid2, sf) for sf in (0, 5)] for n1 in range(168)])
                     for nid2 in range(3)}
        
        cells = {}
        last_publish = 0.0
        buffers = 0
        
        
        def _subcarriers(sym):
            Y = np.fft.fftshift(np.fft.fft(sym))
            return np.concatenate([Y[NFFT // 2 - 31: NFFT // 2], Y[NFFT // 2 + 1: NFFT // 2 + 32]])
        
        
        def compute(ctx):
            global last_publish, buffers
            x = np.asarray(ctx.inputs[0]).reshape(-1).astype(np.complex64)
            attrs = ctx.input_attrs[0]
            fc = float(attrs["frequency"]) if "frequency" in attrs else 0.0
            n = x.size
            buffers += 1
            now = time.time()
        
            # PSS correlation for the three roots, normalised by local energy.
            N = 1 << int(np.ceil(np.log2(n + NFFT)))
            energy = np.convolve(np.abs(x) ** 2, np.ones(NFFT), mode="valid")
            tt = np.arange(n) / FS
            peaks = []
            corr_best = None
            best_metric = 0.0
            for off in OFFSETS_HZ:
                xs = (x * np.exp(-2j * np.pi * off * tt)).astype(np.complex64) if off else x
                X = np.fft.fft(xs, N)
                for nid2 in range(3):
                    c = np.fft.ifft(X * np.conj(np.fft.fft(PSS_T[nid2], N)))[: n - NFFT + 1]
                    metric = np.abs(c) ** 2 / (energy * 62.0 * NFFT + 1e-9)
                    t = int(np.argmax(metric))
                    peaks.append((nid2, float(metric[t]), t, off, xs))
                    if metric[t] > best_metric:
                        best_metric = float(metric[t])
                        corr_best = metric
            trace = np.sqrt(np.clip(corr_best, 0.0, 1.0)).astype(np.float32)
            if trace.size != 1024:
                trace = np.interp(np.linspace(0, 1, 1024), np.linspace(0, 1, trace.size), trace).astype(np.float32)
            ctx.outputs[0][...] = trace
        
            for nid2, metric, t, off, x in peaks:
                if metric < MIN_METRIC or t < NFFT + CP:
                    continue
                # CFO from the cyclic prefix of the PSS symbol.
                cp_corr = np.sum(x[t - CP: t] * np.conj(x[t - CP + NFFT: t + NFFT]))
                cfo_hz = -np.angle(cp_corr) / (2.0 * np.pi) * 15e3
                # Remove CFO, then equalise the SSS symbol with the PSS channel estimate.
                k = np.arange(-(NFFT + CP), NFFT)
                seg = x[t - NFFT - CP: t + NFFT] * np.exp(-2j * np.pi * cfo_hz * k / FS)
                Ypss = _subcarriers(seg[NFFT + CP:])
                Ysss = _subcarriers(seg[:NFFT])
                H = Ypss * np.conj(PSS_F[nid2])
                H = np.convolve(H, np.ones(5) / 5.0, mode="same")
                Yeq = Ysss * np.conj(H) / (np.abs(H) ** 2 + 1e-9)
                scores = np.real(SSS_TABLE[nid2] @ Yeq)
                nid1, sf = np.unravel_index(int(np.argmax(scores)), scores.shape)
                sss_q = float(scores.max() / (np.abs(scores).mean() + 1e-9))
                if sss_q < MIN_SSS_Q:
                    continue
                pci = int(3 * nid1 + nid2)
                power_db = float(10.0 * np.log10(np.mean(np.abs(Ypss) ** 2) / NFFT ** 2 + 1e-20))
                c = cells.setdefault(pci, dict(pci=pci, nid1=int(nid1), nid2=nid2, hits=0, first=now))
                c.update(hits=c["hits"] + 1, last=now, metric=round(metric, 3), sss_quality=round(sss_q, 1),
                         subframe=int(5 * sf), timing_us=round(1e6 * (t % 9600) / FS, 1),
                         cfo_hz=round(float(cfo_hz) + off, 1), power_dbfs=round(power_db, 1))
        
            for pci in [p for p, c in cells.items() if now - c.get("last", now) > SEEN_TTL_S]:
                cells.pop(pci)
        
            if now - last_publish < 0.5:
                return
            last_publish = now
            rows = sorted(cells.values(), key=lambda c: -c["hits"])[:MAX_ROWS]
            ctx.env["cellscan"] = {
                "carrier_mhz": round(fc / 1e6, 3),
                "buffers": buffers,
                "cells_seen": len(rows),
                "best_metric": round(best_metric, 3),
                "cells": [dict(pci=c["pci"], nid1=c["nid1"], nid2=c["nid2"], hits=c["hits"],
                               power="%.1f" % c["power_dbfs"], metric="%.2f" % c["metric"],
                               sss_q="%.1f" % c["sss_quality"], cfo="%.0f" % c["cfo_hz"],
                               timing="%.1f" % c["timing_us"], subframe=c["subframe"],
                               last=time.strftime("%H:%M:%S", time.localtime(c["last"]))) for c in rows],
            }
      file: ''
      inputCount: 1
      outputCount: 1
      outputTensorSpecs:
        - shape: '[1024]'
          axes: '[S]'
          dtype: F32
          device: cpu
      throttled: true
    input:
      input0: '${graph.sdr_lte.output.signal}'
    meta:
      node:
        x: 280
        y: 2180
        width: 700
        height: 400
