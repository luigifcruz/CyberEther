  - name: remote_id_decoder
    module: python
    device: cpu
    runtime: python
    provider: generic
    config:
      source: editor
      code: |
        import time
        import numpy as np
        
        # FAA Remote ID receiver: BLE 4 legacy advertising on channel 38 (2426 MHz) at 4 MS/s,
        # ASTM F3411 / OpenDroneID parsing, and burst timing statistics.
        # Source: HackRF (+LNA) in sdr_rid. Change CHANNEL and the sdr_rid frequency together:
        # ch37 = 2402 MHz, ch38 = 2426 MHz, ch39 = 2480 MHz.
        
        FS = 4.0e6
        SPB = 4                     # samples per bit at 1 Mb/s
        CHANNEL = 38
        AA = 0x8E89BED6
        BURST_DB = 8.0              # burst threshold above the noise floor (on a 4 us power envelope)
        ENVELOPE = 16               # samples averaged for the power envelope
        LPF_CUTOFF_HZ = 0.75e6      # one-sided passband of the pre-detection low-pass
        LPF_TAPS = 31
        MIN_BURST_US = 60.0
        MAX_BURST_US = 2000.0
        MAX_DEVICES = 20
        HISTORY = 200
        ZIPLINE_HINTS = ("ZIP", "ZIPLINE")   # matched against serial, operator ID, and self-ID text
        
        ua_types = {0: "none", 1: "airplane", 2: "helicopter/multirotor", 3: "gyroplane", 4: "hybrid lift",
                    5: "ornithopter", 6: "glider", 7: "kite", 8: "free balloon", 9: "captive balloon",
                    10: "airship", 11: "parachute", 12: "rocket", 13: "tethered", 14: "ground obstacle", 15: "other"}
        
        
        def _bits_lsb(value, nbits):
            return [(value >> i) & 1 for i in range(nbits)]
        
        
        SYNC = np.array(_bits_lsb(0xAA, 8) + _bits_lsb(AA, 32), dtype=np.float32)
        SYNC_NRZ = np.repeat(2.0 * SYNC - 1.0, SPB)
        _n = np.arange(LPF_TAPS) - (LPF_TAPS - 1) / 2.0
        LPF = np.sinc(2.0 * LPF_CUTOFF_HZ / FS * _n) * np.hamming(LPF_TAPS)
        LPF = (LPF / LPF.sum()).astype(np.float32)
        
        
        def _dewhiten(bits, channel):
            p = [1] + [(channel >> (5 - i)) & 1 for i in range(6)]
            out = []
            for b in bits:
                o = p[6]
                out.append(b ^ o)
                p = [o, p[0], p[1], p[2], p[3] ^ o, p[4], p[5]]
            return out
        
        
        def _crc24(bits):
            p = [(0x555555 >> i) & 1 for i in range(24)]
            taps = (1, 3, 4, 6, 9, 10)
            for b in bits:
                fb = b ^ p[23]
                new = [fb] + [p[i - 1] ^ (fb if i in taps else 0) for i in range(1, 24)]
                p = new
            return [p[23 - i] for i in range(24)]
        
        
        def _bytes(bits):
            return bytes(sum(b << i for i, b in enumerate(bits[k:k + 8])) for k in range(0, len(bits) - 7, 8))
        
        
        def _text(raw):
            return raw.split(b"\x00")[0].decode("ascii", "replace").strip()
        
        
        def _i32(b):
            return int.from_bytes(b, "little", signed=True)
        
        
        def _u16(b):
            return int.from_bytes(b, "little")
        
        
        def _parse_message(m, dev):
            mtype = m[0] >> 4
            if mtype == 0x0:
                dev["id_type"] = m[1] >> 4
                dev["ua_type"] = ua_types.get(m[1] & 0xF, str(m[1] & 0xF))
                dev["serial"] = _text(m[2:22])
            elif mtype == 0x1:
                flags = m[1] & 0xF
                direction = m[2] + (180 if flags & 0x2 else 0)
                speed = m[3] * 0.25 if not flags & 0x1 else m[3] * 0.75 + 63.75
                vspeed = int.from_bytes(m[4:5], "little", signed=True) * 0.5
                lat = _i32(m[5:9]) * 1e-7
                lon = _i32(m[9:13]) * 1e-7
                dev.update(status=m[1] >> 4, heading=direction, speed_mps=round(speed, 1), vspeed_mps=vspeed,
                           lat=round(lat, 6), lon=round(lon, 6),
                           alt_baro_m=round(_u16(m[13:15]) * 0.5 - 1000.0, 1),
                           alt_geo_m=round(_u16(m[15:17]) * 0.5 - 1000.0, 1),
                           height_m=round(_u16(m[17:19]) * 0.5 - 1000.0, 1),
                           fix_time="%.1f s past the hour" % (_u16(m[21:23]) * 0.1))
            elif mtype == 0x3:
                dev["self_id"] = _text(m[2:25])
            elif mtype == 0x4:
                dev.update(operator_lat=round(_i32(m[2:6]) * 1e-7, 6), operator_lon=round(_i32(m[6:10]) * 1e-7, 6),
                           operator_alt_m=round(_u16(m[18:20]) * 0.5 - 1000.0, 1))
            elif mtype == 0x5:
                dev["operator_id"] = _text(m[2:22])
            elif mtype == 0xF:
                count = m[2]
                for i in range(count):
                    sub = m[3 + 25 * i: 28 + 25 * i]
                    if len(sub) == 25:
                        _parse_message(sub, dev)
            dev["messages"] = dev.get("messages", 0) + 1
        
        
        def _parse_adv(pdu_bytes, now):
            """Return (mac, is_remote_id) after parsing AD structures."""
            if len(pdu_bytes) < 8:
                return None, False
            mac = ":".join("%02X" % b for b in pdu_bytes[2:8][::-1])
            data = pdu_bytes[8:]
            rid = False
            i = 0
            dev = devices.setdefault(mac, dict(mac=mac, first=now, bursts=0, intervals=[]))
            while i + 1 < len(data):
                ln = data[i]
                if ln == 0 or i + 1 + ln > len(data):
                    break
                ad_type = data[i + 1]
                body = data[i + 2: i + 1 + ln]
                if ad_type == 0x16 and len(body) >= 4 and body[0] == 0xFA and body[1] == 0xFF and body[2] == 0x0D:
                    rid = True
                    msg = body[4:]
                    if len(msg) >= 25:
                        _parse_message(msg, dev)
                i += 1 + ln
            if rid:
                dev["last"] = now
            return mac, rid
        
        
        def _decode_burst(seg):
            d = np.angle(seg[1:] * np.conj(seg[:-1])).astype(np.float32)
            d -= np.median(d)
            if d.size < SYNC_NRZ.size + 16 * SPB:
                return None
            corr = np.correlate(d, SYNC_NRZ, mode="valid")
            start = int(np.argmax(corr))
            if corr[start] < 0.35 * SYNC_NRZ.size * np.abs(d).mean():
                return None
            bit_start = start + SYNC_NRZ.size
            nbits = (d.size - bit_start) // SPB
            if nbits < 16 + 24:
                return None
            soft = d[bit_start: bit_start + nbits * SPB].reshape(nbits, SPB).sum(axis=1)
            raw = [1 if v > 0 else 0 for v in soft]
            bits = _dewhiten(raw, CHANNEL)
            header = _bytes(bits[:16])
            length = header[1]
            if length > 37 or 16 + 8 * length + 24 > len(bits):
                return None
            pdu_bits = bits[: 16 + 8 * length]
            crc_rx = bits[16 + 8 * length: 16 + 8 * length + 24]
            if _crc24(pdu_bits) != crc_rx:
                return "crc"
            return _bytes(pdu_bits)
        
        
        devices = {}
        stats = dict(bursts=0, decoded=0, crc_fail=0, rid_packets=0)
        burst_lengths = []
        burst_times = []
        noise_db = None
        sample_clock = 0
        last_publish = 0.0
        
        
        def compute(ctx):
            global noise_db, sample_clock, last_publish
            x = np.convolve(np.asarray(ctx.inputs[0]).reshape(-1), LPF, mode="same")
            now = time.time()
            env = np.convolve(np.abs(x) ** 2, np.ones(ENVELOPE, dtype=np.float32) / ENVELOPE, mode="same")
            mag_db = 10.0 * np.log10(env + 1e-18)
            floor = float(np.percentile(mag_db, 20))
            noise_db = floor if noise_db is None else 0.9 * noise_db + 0.1 * floor
            above = mag_db > noise_db + BURST_DB
            edges = np.flatnonzero(np.diff(above.astype(np.int8)))
            starts = edges[above[edges + 1]] + 1 if edges.size else np.array([], dtype=int)
            if above[0]:
                starts = np.concatenate([[0], starts])
            ends = edges[~above[edges + 1]] + 1 if edges.size else np.array([], dtype=int)
            if above[-1]:
                ends = np.concatenate([ends, [x.size]])
            k = 0
            for s, e in zip(starts, ends):
                dur_us = (e - s) / FS * 1e6
                if dur_us < MIN_BURST_US or dur_us > MAX_BURST_US:
                    continue
                stats["bursts"] += 1
                burst_lengths.append(dur_us)
                burst_times.append((sample_clock + s) / FS)
                del burst_lengths[:-HISTORY]
                del burst_times[:-HISTORY]
                k += 1
                if k > 40:
                    continue
                s0, e0 = max(0, s - 8), min(x.size, e + 8)
                res = _decode_burst(x[s0:e0])
                if res is None:
                    continue
                if res == "crc":
                    stats["crc_fail"] += 1
                    continue
                stats["decoded"] += 1
                mac, rid = _parse_adv(res, now)
                if mac:
                    dev = devices[mac]
                    dev["bursts"] += 1
                    t = (sample_clock + s) / FS
                    if "last_t" in dev:
                        dev["intervals"].append(t - dev["last_t"])
                        del dev["intervals"][:-50]
                    dev["last_t"] = t
                    dev["last_seen"] = now
                    dev["rid"] = dev.get("rid", False) or rid
                    if rid:
                        stats["rid_packets"] += 1
            sample_clock += x.size
        
            for mac in [m for m, d in devices.items() if now - d.get("last_seen", now) > 120.0]:
                devices.pop(mac)
        
            if now - last_publish < 0.5:
                return
            last_publish = now
            rid_devs = sorted([d for d in devices.values() if d.get("rid")], key=lambda d: -d.get("last_seen", 0))
            others = sum(1 for d in devices.values() if not d.get("rid"))
            rows = []
            for d in rid_devs[:MAX_DEVICES]:
                iv = d["intervals"]
                ident = " ".join(str(d.get(k, "")) for k in ("serial", "operator_id", "self_id")).upper()
                rows.append(dict(mac=d["mac"], serial=d.get("serial", "--"), operator=d.get("operator_id", "--"),
                                 ua=d.get("ua_type", "--"), lat=d.get("lat", "--"), lon=d.get("lon", "--"),
                                 alt=d.get("alt_geo_m", "--"), height=d.get("height_m", "--"),
                                 speed=d.get("speed_mps", "--"), heading=d.get("heading", "--"),
                                 vspeed=d.get("vspeed_mps", "--"), op_lat=d.get("operator_lat", "--"),
                                 op_lon=d.get("operator_lon", "--"), self_id=d.get("self_id", "--"),
                                 packets=d["bursts"], rate_hz="%.2f" % (1.0 / np.median(iv)) if len(iv) >= 3 else "--",
                                 zipline="YES" if any(h in ident for h in ZIPLINE_HINTS) else "no",
                                 last=time.strftime("%H:%M:%S", time.localtime(d["last_seen"]))))
            iv_all = np.diff(np.array(burst_times)) if len(burst_times) >= 3 else np.array([])
            window = (burst_times[-1] - burst_times[0]) if len(burst_times) >= 2 else 0.0
            ctx.env["rid"] = {
                "channel": CHANNEL,
                "noise_dbfs": round(noise_db, 1),
                "bursts_total": stats["bursts"],
                "bursts_per_s": round(len(burst_times) / window, 1) if window > 0 else 0.0,
                "burst_len_us": {"median": round(float(np.median(burst_lengths)), 0) if burst_lengths else 0,
                                 "min": round(float(np.min(burst_lengths)), 0) if burst_lengths else 0,
                                 "max": round(float(np.max(burst_lengths)), 0) if burst_lengths else 0},
                "interval_ms": {"median": round(float(np.median(iv_all)) * 1e3, 1) if iv_all.size else 0,
                                "p10": round(float(np.percentile(iv_all, 10)) * 1e3, 1) if iv_all.size else 0,
                                "p90": round(float(np.percentile(iv_all, 90)) * 1e3, 1) if iv_all.size else 0},
                "decoded": stats["decoded"], "crc_fail": stats["crc_fail"], "rid_packets": stats["rid_packets"],
                "other_ble_devices": others,
                "drones": rows,
            }
      file: ''
      inputCount: 1
      outputCount: 0
      outputTensorSpecs: []
      throttled: false
    input:
      input0: '${graph.sdr_rid.output.signal}'
    meta:
      node:
        x: 280
        y: 2820
        width: 700
        height: 400
