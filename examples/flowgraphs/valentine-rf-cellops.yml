  - name: band_analyzer
    module: python
    device: cpu
    runtime: python
    provider: generic
    config:
      source: editor
      code: |
        import time
        import numpy as np
        
        # Watchlist (MHz). Class "cell" = U.S. LTE / 5G NR downlink bands.
        # Class "drone" = unlicensed links used by delivery drones such as Zipline:
        # 900 MHz ISM telemetry, FAA Remote ID Bluetooth advertising channels 37/38/39,
        # Remote ID Wi-Fi beacon/NAN on channel 6, and the whole 2.4 GHz ISM band.
        BANDS = [
            ("n71",        "5G/LTE 600",            617.0,  652.0, "cell"),
            ("B29",        "LTE 700 SDL",           717.0,  728.0, "cell"),
            ("B12/B17",    "LTE 700 Lower",         729.0,  746.0, "cell"),
            ("B13",        "LTE 700 Upper C",       746.0,  756.0, "cell"),
            ("B14",        "LTE 700 PS",            758.0,  768.0, "cell"),
            ("B5/n5",      "LTE/5G 850",            869.0,  894.0, "cell"),
            ("ISM900",     "Drone 900 MHz telemetry", 902.0, 928.0, "drone"),
            ("B2/B25/n25", "LTE/5G PCS",           1930.0, 1995.0, "cell"),
            ("B4/B66/n66", "LTE/5G AWS",           2110.0, 2200.0, "cell"),
            ("B30",        "LTE WCS",              2350.0, 2360.0, "cell"),
            ("ISM2400",    "Drone 2.4 GHz ISM",    2400.0, 2483.5, "drone"),
            ("RID-BT37",   "Drone Remote ID BT ch37", 2401.0, 2403.0, "drone"),
            ("RID-BT38",   "Drone Remote ID BT ch38", 2425.0, 2427.0, "drone"),
            ("RID-WiFi6",  "Drone Remote ID Wi-Fi ch6", 2427.0, 2447.0, "drone"),
            ("RID-BT39",   "Drone Remote ID BT ch39", 2479.0, 2481.0, "drone"),
            ("B41/n41",    "LTE/5G BRS",           2496.0, 2690.0, "cell"),
            ("n48",        "5G CBRS",              3550.0, 3700.0, "cell"),
            ("n77",        "5G C-band",            3700.0, 3980.0, "cell"),
        ]
        RADIO_MIN_MHZ = 30.0      # LimeSDR XTRX tuning range
        RADIO_MAX_MHZ = 3800.0
        HISTORY = 120             # sweeps kept per band in the occupancy heatmap
        TRACE_POINTS = 512
        MAX_ALERTS = 50
        
        history = np.zeros((len(BANDS), HISTORY), dtype=np.float32)
        bands = [dict(name=n, tech=t, lo=lo, hi=hi, cls=c, peak=None, noise=None, occ=None,
                      coverage=0.0, cov_status="", last_scan_t=0.0, bins=0, baseline=None, live=None)
                 for (n, t, lo, hi, c) in BANDS]
        alerts = []
        evidence = {}
        next_alert_id = 1
        sweep_count = 0
        last_fingerprint = None
        last_sweep_t = 0.0
        span = (0.0, 0.0)
        bins = 0
        trace = np.zeros(TRACE_POINTS, dtype=np.float32)
        trace_meta = {"source": "waiting for first sweep", "lo": 617.0, "hi": 652.0}
        last_publish = 0.0
        
        
        def _hms(t):
            return time.strftime("%H:%M:%S", time.localtime(t))
        
        
        def _resample(p, n=TRACE_POINTS):
            p = np.asarray(p, dtype=np.float32)
            if p.size == n:
                return p.copy()
            return np.interp(np.linspace(0.0, 1.0, n), np.linspace(0.0, 1.0, p.size), p).astype(np.float32)
        
        
        def _raise_alert(b, kind, value, thr, p, now):
            global next_alert_id
            for a in alerts:
                if a["band"] == b["name"] and a["kind"] == kind and a["status"] == "NEW":
                    return
            aid = next_alert_id
            next_alert_id += 1
            alerts.insert(0, dict(id=aid, time=_hms(now), band=b["name"], kind=kind,
                                  value="%.1f" % value, threshold="%.1f" % thr, status="NEW",
                                  peak="%.1f" % b["peak"], noise="%.1f" % b["noise"]))
            evidence[aid] = dict(trace=_resample(p), lo=b["lo"], hi=b["hi"], band=b["name"], kind=kind, time=_hms(now))
            del alerts[MAX_ALERTS:]
            keep = {a["id"] for a in alerts}
            for k in list(evidence):
                if k not in keep:
                    evidence.pop(k)
        
        
        def _fmt(v):
            return "--" if v is None else "%.1f" % v
        
        
        def compute(ctx):
            global sweep_count, last_fingerprint, last_sweep_t, span, bins, trace, trace_meta, last_publish
            ctrl = ctx.env.get("cellops_control", {}) or {}
            peak_thr = float(ctrl.get("peak_alert_dbfs", -45.0))
            occ_thr = float(ctrl.get("occupancy_alert", 0.6))
            rise_thr = float(ctrl.get("noise_rise_alert_db", 8.0))
            occ_margin = float(ctrl.get("occupancy_margin_db", 6.0))
            stale_after = float(ctrl.get("stale_after_s", 120.0))
            drone_margin = float(ctrl.get("drone_alert_db", 10.0))
            hold_band = str(ctrl.get("hold_band", "") or "")
            open_alert = ctrl.get("open_alert", 0) or 0
            ack_alert = ctrl.get("ack_alert", 0) or 0
            sort_by = str(ctrl.get("sort_by", "peak") or "peak")
        
            x = np.asarray(ctx.inputs[0]).reshape(-1)
            attrs = ctx.input_attrs[0]
            fc = float(attrs["frequency"]) if "frequency" in attrs else 0.0
            fs = float(attrs["sampleRate"]) if "sampleRate" in attrs else 0.0
            n = int(x.size)
            now = time.time()
        
            head = min(n, 256)
            fp = (n, float(np.abs(x[:head]).sum()), float(np.abs(x[-head:]).sum()))
            new_sweep = fp != last_fingerprint and n > 8 and fs > 0.0
        
            if new_sweep:
                last_fingerprint = fp
                sweep_count += 1
                last_sweep_t = now
                bins = n
                spec = np.fft.fftshift(np.fft.fft(x))
                pwr = (20.0 * np.log10(np.abs(spec) / n + 1e-12)).astype(np.float32)
                freqs = (fc + (np.arange(n) - n / 2.0) * (fs / n)) / 1e6
                span = (float(freqs[0]), float(freqs[-1]))
                history[:, :-1] = history[:, 1:]
                for i, b in enumerate(bands):
                    ov = max(0.0, min(b["hi"], span[1]) - max(b["lo"], span[0]))
                    cov = ov / (b["hi"] - b["lo"])
                    mask = (freqs >= b["lo"]) & (freqs <= b["hi"])
                    nb = int(mask.sum())
                    b["in_span"] = bool(nb >= 4 and cov > 0.0)
                    if nb >= 4 and cov > 0.0:
                        p = pwr[mask]
                        noise = float(np.percentile(p, 20))
                        peak = float(p.max())
                        occ = float(np.mean(p > noise + occ_margin))
                        b.update(peak=peak, noise=noise, occ=occ, coverage=100.0 * cov, bins=nb,
                                 last_scan_t=now, live=p, cov_status="FULL" if cov >= 0.98 else "PARTIAL")
                        history[i, -1] = occ
                        if peak > peak_thr:
                            _raise_alert(b, "PEAK", peak, peak_thr, p, now)
                        if occ > occ_thr:
                            _raise_alert(b, "OCCUPANCY", 100.0 * occ, 100.0 * occ_thr, p, now)
                        if b["baseline"] is not None and noise > b["baseline"] + rise_thr:
                            _raise_alert(b, "NOISE RISE", noise - b["baseline"], rise_thr, p, now)
                        if b["cls"] == "drone" and b["baseline"] is not None and peak > b["baseline"] + drone_margin:
                            _raise_alert(b, "DRONE LINK", peak - b["baseline"], drone_margin, p, now)
                        b["baseline"] = noise if b["baseline"] is None else 0.9 * b["baseline"] + 0.1 * noise
                    else:
                        history[i, -1] = 0.0
        
            # Acknowledge alerts.
            if ack_alert:
                for a in alerts:
                    if str(ack_alert).lower() == "all" or str(a["id"]) == str(ack_alert):
                        a["status"] = "ACK"
        
            # Evidence trace: an opened alert, else the held band, else the strongest live band.
            try:
                open_id = int(open_alert)
            except (TypeError, ValueError):
                open_id = 0
            if open_id and open_id in evidence:
                ev = evidence[open_id]
                trace = ev["trace"]
                trace_meta = {"source": "ALERT #%d %s %s at %s (saved FFT)" % (open_id, ev["band"], ev["kind"], ev["time"]),
                              "lo": ev["lo"], "hi": ev["hi"]}
            else:
                target = None
                if hold_band:
                    target = next((b for b in bands if b["name"] == hold_band), None)
                if target is None or target["live"] is None:
                    live = [b for b in bands if b["live"] is not None]
                    target = max(live, key=lambda b: b["peak"]) if live else None
                if target is not None and target["live"] is not None:
                    trace = _resample(target["live"])
                    label = "HELD" if hold_band and target["name"] == hold_band else "LIVE strongest"
                    trace_meta = {"source": "%s %s %s" % (label, target["name"], _hms(target["last_scan_t"])),
                                  "lo": target["lo"], "hi": target["hi"]}
        
            ctx.outputs[0][...] = history
            ctx.outputs[1][...] = np.clip((trace + 100.0) / 100.0, 0.0, 1.0)
            ctx.output_attrs[1]["frequency"] = np.float32((trace_meta["lo"] + trace_meta["hi"]) * 0.5e6)
            ctx.output_attrs[1]["sampleRate"] = np.float32((trace_meta["hi"] - trace_meta["lo"]) * 1e6)
        
            if not new_sweep and now - last_publish < 0.5:
                return
            last_publish = now
        
            rows = []
            for b in bands:
                unsupported = b["hi"] > RADIO_MAX_MHZ or b["lo"] < RADIO_MIN_MHZ
                age = (now - b["last_scan_t"]) if b["last_scan_t"] else None
                if unsupported:
                    status = "UNSUPPORTED"
                elif b["last_scan_t"] == 0.0:
                    status = "NOT SCANNED"
                elif age is not None and age > stale_after:
                    status = "STALE"
                elif not b.get("in_span", False):
                    status = "IDLE"
                else:
                    status = b["cov_status"]
                if hold_band and b["name"] == hold_band:
                    status = "HELD " + status
                rows.append(dict(name=b["name"], tech=b["tech"], cls=b["cls"], range="%.0f-%.0f" % (b["lo"], b["hi"]),
                                 status=status, peak=_fmt(b["peak"]), noise=_fmt(b["noise"]),
                                 occupancy="--" if b["occ"] is None else "%.0f" % (100.0 * b["occ"]),
                                 coverage="%.0f" % b["coverage"],
                                 last_scan=_hms(b["last_scan_t"]) if b["last_scan_t"] else "--",
                                 age="--" if age is None else "%.0f" % age,
                                 _peak=b["peak"] if b["peak"] is not None else -999.0,
                                 _noise=b["noise"] if b["noise"] is not None else -999.0,
                                 _occ=b["occ"] if b["occ"] is not None else -1.0,
                                 _t=b["last_scan_t"], _held=1 if (hold_band and b["name"] == hold_band) else 0))
            keys = {
                "peak": lambda r: (-r["_held"], -r["_peak"]),
                "occupancy": lambda r: (-r["_held"], -r["_occ"]),
                "noise": lambda r: (-r["_held"], -r["_noise"]),
                "name": lambda r: (-r["_held"], r["name"]),
                "last_scan": lambda r: (-r["_held"], -r["_t"]),
                "status": lambda r: (-r["_held"], r["status"]),
                "class": lambda r: (-r["_held"], 0 if r["cls"] == "drone" else 1, -r["_peak"]),
            }
            rows.sort(key=keys.get(sort_by, keys["peak"]))
            for i, r in enumerate(rows):
                r["rank"] = i + 1
                for k in [k for k in r if k.startswith("_")]:
                    r.pop(k)
        
            held = next((b for b in bands if b["name"] == hold_band), None) if hold_band else None
            if held is not None:
                mode = "HOLD %s" % held["name"]
                hint = "sweep Start/End = %.0f / %.0f MHz" % (held["lo"], held["hi"])
            else:
                mode = "SCANNING"
                hint = "set HOLD_BAND in scan_controls to hold"
            speed = ctx.metrics.get_value("sweep", "sweepSpeed", default="--")
            loss = ctx.metrics.get_value("sweep", "bufferLoss", default=0.0)
            if isinstance(loss, (tuple, list)) and loss:
                loss = loss[0]
            try:
                loss_s = loss if isinstance(loss, str) else "%.1f%%" % (100.0 * float(loss))
            except (TypeError, ValueError):
                loss_s = str(loss)
            sweep_age = (now - last_sweep_t) if last_sweep_t else None
            ctx.env["cellops"] = {
                "mode": mode,
                "mode_hint": hint,
                "sort_by": sort_by,
                "radio": {
