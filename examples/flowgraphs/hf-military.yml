  - name: hf_dashboard
    module: note
    device: cpu
    runtime: native
    provider: generic
    config:
      content: |-
        # HF Military / Diplomatic / Intelligence Modes
        ```stats 4
        Target | ${env.hf.target.target_mhz} MHz ${env.hf.target.sideband} | blue | SNR ${env.hf.target.snr_db} dB
        Verdict | ${env.hf.mode} | red | confidence ${env.hf.confidence} %
        Fingerprint | ${env.hf.target.tones} tones @ ${env.hf.target.spacing_hz} Hz | purple | BW ${env.hf.target.bw_hz} Hz, baud ${env.hf.target.baud}, PSK order ${env.hf.target.psk_order}, FSK shift ${env.hf.target.fsk_shift_hz} Hz
        Capture | ${env.hf.span} | green | ${env.hf.buffers} buffers, ${env.hf.channels_now} channels active now
        ```
        Set `TARGET_KHZ` in **hf_controls** (or leave `auto` for the strongest narrow channel) and `SIDEBAND`. **channel_spectrum** shows the tuned channel at 9.5 Hz resolution. The verdict is a fingerprint match, not a decode; a mode is logged below once it has been stable for four analysis windows.
        
        **Mode rules:** 188-110A/B/D, STANAG 4415, 3G-ALE, 4481-PSK = 2400 Bd serial-tone PSK ~2.4-3 kHz; 141A 2G-ALE = 8 tones @ 250 Hz, 125 Bd; STANAG 4481 FSK = 850 Hz shift 75 Bd; CIS-12/AT3004D = 12 tones @ 200 Hz, 120 Bd; CIS-36-50 / CIS-50-50 = 36-50 tones @ 62.5 Hz, 50 Bd; XPA/XPA2 = 10-16 tones @ ~100 Hz, 10 Bd; HM01 = ~43-tone RDFT block alternating with AM voice; Pactor I = 200 Bd 2-FSK 200 Hz; Pactor II = 2-tone DPSK 100 Bd; Pactor III = up to 18 tones 100 Bd; Pactor IV = 1800 Bd PSK.
        
        ## Active channels (2-22 MHz)
        | kHz | Allocation | Peak dBFS | SNR dB | BW kHz | Duty % | Last |
        |--:|---|--:|--:|--:|--:|---|
        | ${env.hf.channels[*].khz} | ${env.hf.channels[*].alloc} | ${env.hf.channels[*].peak} | ${env.hf.channels[*].snr} | ${env.hf.channels[*].bw} | ${env.hf.channels[*].duty} | ${env.hf.channels[*].last} |
        
        ## Detections log
        | Time | MHz | Mode | Conf % | SNR dB |
        |---|--:|---|--:|--:|
        | ${env.hf.log[*].time} | ${env.hf.log[*].mhz} | ${env.hf.log[*].mode} | ${env.hf.log[*].conf} | ${env.hf.log[*].snr} |
        
        > [!NOTE]
        > Without an antenna the channel list is the HackRF's own spurs (20.000 MHz clock harmonic, 4619, 2310 kHz etc.). Real HF needs a long wire or active loop; WWV 10/15/20 MHz and the 49/31 m broadcast bands are the first sanity checks.
    meta:
      node:
        x: 3456
        y: 170
        width: 1500
        height: 1180
