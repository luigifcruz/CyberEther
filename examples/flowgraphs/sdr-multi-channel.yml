---
version: 2
title: Multi-channel SDR
summary: Split a native multi-channel capture into separate receiver streams.
author: CyberEther
license: MIT
description: One native SDR block receives RX1 and RX2 in one tensor, and Slice blocks select each receiver for a spectrum analyzer. Select a bladeRF 2.0 in Device to start.
graph:
  - name: note
    module: note
    device: cpu
    runtime: native
    provider: generic
    config:
      content: |-
        # Multi-channel SDR
        **This example opens with no radio selected. Pick one first.**

        1. Connect antennas to **RX1** and **RX2** of a **bladeRF 2.0**, then choose it in the **Device** dropdown on the **SDR** block.
        2. Watch both displays. The top **Spectrum Analyzer** shows **RX1** and the bottom one shows **RX2**.

        ## What you are looking at
        The **SDR** block has **Channels** set to 2, so both receivers come out of one port with a channel axis in front of the batches. Each **Slice** block picks one receiver, with [0, ...] for **RX1** and [1, ...] for **RX2**.

        Both receivers share **Frequency** and **Sample Rate**, and their samples stay aligned. Phase and gain calibration between the antennas is up to you.

        ## Try it
        1. Change **Frequency** and watch both receivers retune together.
        2. Set an entry of **Automatic Gains** to 0 to switch that receiver to manual gain.

        ## Notes
        - Two-channel capture needs bladeRF FPGA v0.15.3 or newer.
        - The original bladeRF has one receiver and cannot run this example.
        - When the chain falls behind, both receivers drop their oldest samples together.
    meta:
      node:
        x: 40
        y: 550
        width: 360
        height: 300
  - name: radio
    module: sdr
    device: cpu
    runtime: native
    provider: generic
    config:
      deviceString: ''
      channels: 2
      frequency: 96900000
      sampleRate: 2000000
      automaticGain: true
      automaticGains: [1, 1]
      biasTee: false
    meta:
      node:
        x: 40
        y: 40
        width: 340
        height: 0
  - name: select_rx1
    module: slice
    device: cpu
    runtime: native
    provider: generic
    config:
      slice: '[0, ...]'
    input:
      buffer: '${graph.radio.output.signal}'
    meta:
      node:
        x: 450
        y: 40
        width: 320
        height: 0
  - name: select_rx2
    module: slice
    device: cpu
    runtime: native
    provider: generic
    config:
      slice: '[1, ...]'
    input:
      buffer: '${graph.radio.output.signal}'
    meta:
      node:
        x: 450
        y: 550
        width: 320
        height: 0
  - name: rx1
    module: spectrum_analyzer
    device: cpu
    runtime: native
    provider: generic
    config: {}
    input:
      buffer: '${graph.select_rx1.output.buffer}'
    meta:
      node:
        x: 850
        y: 40
        width: 800
        height: 0
  - name: rx2
    module: spectrum_analyzer
    device: cpu
    runtime: native
    provider: generic
    config: {}
    input:
      buffer: '${graph.select_rx2.output.buffer}'
    meta:
      node:
        x: 850
        y: 550
        width: 800
        height: 0
