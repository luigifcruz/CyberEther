  - name: python_qpsk
    module: python
    device: cpu
    runtime: python
    provider: generic
    config:
      source: editor
      code: |-
        import numpy as np

        def rrc_filter(x, sample_rate, symbol_rate, roll_off, taps, history):
            sps, b = sample_rate / symbol_rate, roll_off
            t = (np.arange(taps) - (taps - 1) / 2) / sps
            edge = np.isclose(np.abs(4 * b * t), 1)
            with np.errstate(divide="ignore", invalid="ignore"):
                h = np.sin(np.pi * t * (1 - b)) + 4 * b * t * np.cos(np.pi * t * (1 + b))
                h /= np.pi * t * (1 - (4 * b * t) ** 2)
                q = np.pi / (4 * b)
                h[edge] = b / np.sqrt(2) * (
                    (1 + 2 / np.pi) * np.sin(q) + (1 - 2 / np.pi) * np.cos(q))
            h[t == 0] = 1 + b * (4 / np.pi - 1)
            if history is None:
                history = np.zeros(taps - 1, dtype=x.dtype)
            samples = np.concatenate((history, x))
            return np.convolve(samples, h, mode="valid"), samples[-(taps - 1):].copy()

        rng = np.random.default_rng(7)
        samples_per_symbol = 8
        amplitude = 0.7
        sample_rate = 1e6
        symbol_rate = sample_rate / samples_per_symbol
        roll_off = 0.35
        taps = 11 * samples_per_symbol + 1
        rrc_history = None

        def compute(ctx):
            global rrc_history
            count = ctx.inputs[0].size // samples_per_symbol
            bits = rng.integers(0, 2, (2, count))
            i, q = 2 * bits - 1
            symbols = amplitude * (i + 1j * q) / np.sqrt(2)
            signal = np.zeros((count, samples_per_symbol), dtype=symbols.dtype)
            signal[:, 0] = symbols
            filtered, rrc_history = rrc_filter(
                signal.ravel(), sample_rate, symbol_rate, roll_off, taps, rrc_history)
            ctx.outputs[0][...] = filtered
            attrs = ctx.input_attrs[0]
            ctx.output_attrs[0]["sampleRate"] = attrs["sampleRate"]
            ctx.output_attrs[0]["frequency"] = attrs["frequency"]
      inputCount: 1
      outputCount: 1
      outputTensorSpecs:
        - shape: '[4096]'
          axes: '[S]'
          dtype: CF32
          device: cpu
      throttled: false
