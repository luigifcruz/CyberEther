  - name: experiment
    module: note
    device: cpu
    runtime: native
    provider: generic
    config:
      content: |-
        # Try it
        1. Raise **Noise Variance** on the **Signal Generator** from 0.005 to 0.05. The clouds spread and the spectrum floor rises. Set it to 0 for four clean dots. Restore 0.005.
        2. In the code, change **samples_per_symbol** from 8 to 4 and press **Ctrl+Enter** to run. The symbol rate doubles and the hump grows twice as wide. Try 16 to narrow it. Restore 8.
        3. Change **amplitude** from 0.7 to 0.3 and run. The clouds slide toward the center and sink into the noise. Restore 0.7.
        4. Break something on purpose. Delete a character, run, and read the status line under the code. Fix it and run again. The rest of the graph keeps going.

        ## Rules of the road
        - Edits do nothing until you press **Ctrl+Enter**. The status line says **Edited** until then.
        - The output stays at 4096 complex samples. Its shape, type, and device are fixed by the **Output 0** row under the code, and the code cannot change them.
        - Inputs are read-only. Copy an input before modifying it.
        - The last three lines copy the sample rate and frequency to the output so the plots can label their axes. Any attribute the code does not copy is dropped.

        ## If the block is not running
        - **Python not found** means CyberEther could not use a Python on your computer. Open **Settings**, choose the **Runtime** tab, and pick an installation that has NumPy. The choice applies after a restart.
        - **Import failed** usually means the block is running a different Python than your terminal. Same fix.
        - **Throttled** runs the code at a slow fixed rate instead of every cycle. Leave it off here or the waterfall crawls.
