  - name: python_qpsk
    module: python
    device: cpu
    runtime: python
    provider: generic
    config:
      code: |-
        import numpy as np
        
        rng = np.random.default_rng(7)
        samples_per_symbol = 8
        amplitude = 0.7
        
        def compute(ctx):
            noise = ctx.inputs[0]
            count = noise.size // samples_per_symbol
        
            # Two random bits choose one of four QPSK phases.
            bits = rng.integers(0, 2, (2, count))
            i, q = 2 * bits - 1
            symbols = amplitude * (i + 1j * q) / np.sqrt(2)
        
            # Hold each symbol, then add it to the incoming noise.
            signal = np.repeat(symbols, samples_per_symbol)
            ctx.outputs[0][...] = noise + signal
        
            attrs = ctx.input_attrs[0]
            ctx.output_attrs[0]["sampleRate"] = attrs["sampleRate"]
            ctx.output_attrs[0]["frequency"] = attrs["frequency"]
      inputCount: 1
      outputCount: 1
      outputTensorSpecs:
        - shape: '[4096]'
          axes: '[S]'
          dtype: CF32
          device: cpu
      throttled: false
    input:
      input0: '${graph.noise.output.signal}'
    meta:
      node:
