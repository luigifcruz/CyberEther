    config:
      content: |-
        # Python Block
        **No radio needed, but Python with NumPy must be installed.**

        The **Signal Generator** makes faint complex noise. The **Python** block adds a random QPSK signal on top of it, in about twenty lines of NumPy you can read and edit right on the canvas. The **Spectrum Analyzer** and the **Constellation** show the result.

        ## What is QPSK
        Quadrature phase shift keying sends two bits at a time by choosing one of four carrier phases. Every 8 samples the code draws a fresh pair of bits and jumps to the matching phase. At a 1 MHz sample rate that is 125,000 symbols per second, or 250 kilobits per second.

        ## Reading the plots
        - **Constellation** plots every sample as a dot, in-phase across and quadrature up. The four clouds are the four phases. Noise smears each one into a cloud, and wider clouds mean a harder job for a receiver telling them apart.
        - **Spectrum** shows a broad hump instead of a single peak. Jumping abruptly between phases spreads energy across frequency. The main hump spans about 125 kHz either side of center, which is the symbol rate, with ripples beyond it because rectangular pulses have sharp edges. Real radios round those edges with a pulse shaping filter to stay inside their channel.

        **Next:** open **Signal Generator** to see a tone, a chirp, and noise built the same way, or read the Python block guide under **Help** for the full context API.
