---
version: 2
title: Wideband Sweep
summary: Sweep a radio across a band wider than its sample rate.
author: Luigi
license: MIT
description: Sweeps the FM broadcast band in hops, stitches the spectra into synthetic complex samples, and displays them in a Spectrum Analyzer.
graph:
  - name: note
    module: note
    device: cpu
    runtime: native
    provider: generic
    config:
      content: |-
        # Wideband Sweep
        **This example opens with no radio selected. Pick one first.**

        1. Plug in your SDR and choose it in the **Device** dropdown on the **SDR Sweep** block.
        2. Watch the display fill in. Each row of the waterfall is one complete sweep from **Start Frequency** to **End Frequency**.

        ## What you are looking at
        A radio only sees a few MHz at once. The **SDR Sweep** block retunes it in hops, transforms each capture, and joins the pieces into one spectrum from 88 to 108 MHz. It then turns that spectrum back into complex samples so the **Spectrum Analyzer** can draw it like any other signal.

        Each hop is captured at a different moment. The display is a picture of the band, not one recording, so do not demodulate it or measure timing across hops.

        ## Try it
        1. Change **Start Frequency** and **End Frequency** to sweep another band. Wider spans take longer per sweep.
        2. Lower **Resolution** to request finer detail. The effective grid adjusts when capture or output limits require it, without dropping frequency coverage.
        3. Raise **Dwell** to average more captures per hop for a calmer noise floor.
        4. Watch **Sweep Speed** for completed sweeps per second.

        ## Is it keeping up?
        - **Buffer Fill** shows smoothed occupancy of the latest-completed-frame software slot, not a hardware FIFO.
        - **Buffer Loss** counts completed frames overwritten or expired before the chain reads them.

        ## Notes
        - Sweep operation is automatic and works the same in the desktop app and the browser. The radio streams the whole time and retunes between hops, skipping samples that may predate each retune plus the **Settling Time**.
        - A HackRF with recent firmware can sweep in hardware at 20 MS/s when the settings fit, much faster than retuning.
        - A bladeRF retunes from stored profiles, and a LimeSDR reuses cached tuning when it is the only one open.
        - Larger spans need more bins. With very large sweeps, lower **Waterfall Height** to keep memory use reasonable.
        - The analyzer spreads its points evenly from edge to edge, so labels near the right edge can read up to one bin high. Rows from before a change stay in the waterfall.
    meta:
      node:
        x: 48.587524
        y: 510.79816
        width: 412
        height: 368
