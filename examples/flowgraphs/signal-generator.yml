      signalType: noise
      signalDataType: CF32
      sampleRate: 5000000
      frequency: 0
      amplitude: 1
      phase: 0
      dcOffset: 0
      noiseVariance: 1
      chirpStartFreq: 1000
      chirpEndFreq: 10000
      chirpDuration: 1
      bufferSize: 8192
