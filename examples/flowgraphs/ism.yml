        | Zigbee ch | MHz | Occ % | Peak | Note |
        |--:|--:|--:|--:|---|
        | ${env.ism24.zigbee[*].ch} | ${env.ism24.zigbee[*].mhz} | ${env.ism24.zigbee[*].occ} | ${env.ism24.zigbee[*].peak} | ${env.ism24.zigbee[*].note} |
        
        | BLE | MHz | Occ % | Peak | Note |
        |---|--:|--:|--:|---|
