  - name: ook_decoder
    module: python
    device: cpu
    runtime: python
    provider: generic
    config:
      source: editor
      code: |
        import time
        import numpy as np
        
        # rtl_433-style OOK/ASK decoder for 433.92 MHz (retune ook_rx to 315 MHz for garage/TPMS gear).
        # Extracts pulses from each burst, decides PWM vs PPM, recovers bits, fingerprints devices by code.
        
        FS = 1.024e6
        SMOOTH = 8                 # envelope smoothing, samples
        THRESH_DB = 12.0           # pulse threshold above the noise floor
        MIN_PULSE_US = 100.0
        FRAME_GAP_US = 12000.0     # a low this long ends a frame (fob header gaps are ~4 ms, repeats ~15 ms+)
        MIN_PULSES = 8
        MAX_FRAMES = 12
        MAX_DEVICES = 24
        
        frame = []
        carry = None
        frames = []
        devices = {}
        stats = dict(buffers=0, bursts=0, decoded=0, floor_db=None)
        last_publish = 0.0
        reset_seen = None
        
        
        def _classify(nbits, mod, short, long_):
            ratio = long_ / max(short, 1.0)
            if mod == "PWM" and 60 <= nbits <= 80 and 1.8 < ratio < 4.0:
                return "rolling-code key fob (KeeLoq-like, 66-bit)"
            if mod == "PWM" and 48 <= nbits <= 59:
                return "key fob / garage remote (rolling code, PWM)"
            if nbits in (24, 25) and mod == "PWM" and 2.2 < ratio < 4.5:
                return "EV1527/PT2262 remote (20-bit address + 4-bit button)"
            if nbits in (36, 37, 40, 41) and mod == "PWM":
                return "weather/temperature sensor (PWM)"
            if nbits in (32, 33, 34) and mod == "PPM":
                return "PPM sensor (Oregon/Acurite style)"
            if mod == "PPM" and 60 <= nbits <= 70:
                return "TPMS/automotive (PPM)"
            return "unknown %s, %d bits" % (mod, nbits)
        
        
        def _decode(pulses, rssi, now):
            hi = np.array([p[0] for p in pulses])
            lo = np.array([p[1] for p in pulses[1:]])
            if hi.size < MIN_PULSES:
                return
            if lo.size and float(np.median(lo)) < 40.0:
                return                      # continuous carrier with noise dips: handled by the FSK path
            # Drop leading preamble/header: pulses whose preceding gap is far longer than the rest.
            if lo.size > 4:
                med = float(np.median(lo))
                cut = int(np.argmax(lo > 6 * med)) + 1 if np.any(lo > 6 * med) else 0
                if 0 < cut < hi.size - MIN_PULSES:
                    hi, lo = hi[cut:], lo[cut:]
            stats["bursts"] += 1
            hi_ratio = hi.max() / max(hi.min(), 1.0)
            lo_ratio = (lo.max() / max(lo.min(), 1.0)) if lo.size else 1.0
            if hi_ratio >= 1.8 and hi_ratio >= lo_ratio:
                mod, d = "PWM", hi
            elif lo_ratio >= 1.8:
                mod, d = "PPM", lo
            else:
                mod, d = "MANCHESTER?", hi
            thr = (d.min() + d.max()) / 2.0
            bits = (d > thr).astype(int)
            short = float(np.median(d[d <= thr])) if np.any(d <= thr) else float(d.min())
            long_ = float(np.median(d[d > thr])) if np.any(d > thr) else float(d.max())
            bitstr = "".join(str(b) for b in bits)
            hexstr = format(int(bitstr, 2), "X") if bits.size else ""
            nbits = int(bits.size)
            kind = _classify(nbits, mod, short, long_)
            key = "%s/%d/%s" % (mod, nbits, hexstr)
            dev = devices.setdefault(key, dict(code=hexstr, bits=nbits, mod=mod, first=now, count=0))
            dev.update(count=dev["count"] + 1, last=now, rssi=round(rssi, 1), short_us=round(short), long_us=round(long_), kind=kind)
            frames.insert(0, dict(time=time.strftime("%H:%M:%S", time.localtime(now)), mod=mod, bits=nbits,
                                  code=hexstr[:24], rssi=round(rssi, 1), short=round(short), long=round(long_),
                                  kind=kind, pulses=int(hi.size)))
            del frames[MAX_FRAMES:]
            stats["decoded"] += 1
        
        
        def _decode_fsk(seg, rssi, now):
            """Continuous burst: FM-discriminate, binarise around the centre, recover symbols."""
            if seg.size < 2000:
                return
            d = np.angle(seg[1:] * np.conj(seg[:-1])) * FS / (2.0 * np.pi)      # instantaneous frequency, Hz
            d = np.convolve(d, np.ones(6) / 6.0, mode="same")
            lo_q, hi_q = np.percentile(d, 10), np.percentile(d, 90)
            dev_khz = (hi_q - lo_q) / 2e3
            if dev_khz < 2.0:
                kind = "continuous carrier, no modulation (ASK/CW?)"
                sym_us, nbits, hexstr, rate = 0, 0, "", 0
            else:
                bits_raw = d > (lo_q + hi_q) / 2.0
                edges = np.flatnonzero(np.diff(bits_raw.astype(np.int8))) + 1
                bounds = np.concatenate([[0], edges, [bits_raw.size]])
                runs = np.diff(bounds)
                runs = runs[runs >= 4]
                if runs.size < 8:
                    return
                sym = float(np.percentile(runs, 10))
                sym_us = sym * 1e6 / FS
                rate = FS / sym / 1e3
                bits = []
                for i in range(len(bounds) - 1):
                    n = int(round((bounds[i + 1] - bounds[i]) / sym))
                    bits.extend([int(bits_raw[bounds[i]])] * max(n, 0))
                nbits = len(bits)
                hexstr = format(int("".join(str(b) for b in bits[:256]), 2), "X") if bits else ""
                kind = "FSK burst: %.1f ms, dev +/-%.0f kHz, ~%.1f kbps" % (seg.size / FS * 1e3, dev_khz, rate)
                if 20 <= rate <= 60 and 10 <= seg.size / FS * 1e3 <= 200:
                    kind += " (modern key fob / TPMS style)"
            stats["bursts"] += 1
            stats["decoded"] += 1
            key = "FSK/%s" % hexstr[:12]
            dev = devices.setdefault(key, dict(code=hexstr, bits=nbits, mod="FSK", first=now, count=0))
            dev.update(count=dev["count"] + 1, last=now, rssi=round(rssi, 1), short_us=round(sym_us), long_us=round(dev_khz),
                       kind=kind, code=hexstr, bits=nbits)
            frames.insert(0, dict(time=time.strftime("%H:%M:%S", time.localtime(now)), mod="FSK", bits=nbits,
                                  code=hexstr[:24], rssi=round(rssi, 1), short=round(sym_us), long=round(dev_khz),
                                  kind=kind, pulses=0))
            del frames[MAX_FRAMES:]
        
        
        def compute(ctx):
            global carry, frame, last_publish
            global reset_seen
            ctl = ctx.env.get("lab_control", {}) or {}
            token = (ctl.get("reset_all", 0), ctl.get("reset_ook", 0))
            if reset_seen is None:
                reset_seen = token
            elif token != reset_seen:
                reset_seen = token
                frames.clear(); devices.clear(); frame = []; carry = None
                stats.update(buffers=0, bursts=0, decoded=0)
            x = np.asarray(ctx.inputs[0]).reshape(-1)
            # Band-limit to +/-250 kHz around the tuned frequency and notch the RTL-SDR DC/LO leakage.
            X = np.fft.fft(x)
            fbin = np.fft.fftfreq(x.size, 1.0 / FS)
            X[(np.abs(fbin) < 15e3) | (np.abs(fbin) > 250e3)] = 0
            x = np.fft.ifft(X).astype(np.complex64)
            now = time.time()
            stats["buffers"] += 1
            p = np.convolve(np.abs(x) ** 2, np.ones(SMOOTH, dtype=np.float32) / SMOOTH, mode="same")
            pdb = 10.0 * np.log10(p + 1e-18)
            floor = float(np.percentile(pdb, 20))
            stats["floor_db"] = floor if stats["floor_db"] is None else 0.9 * stats["floor_db"] + 0.1 * floor
            mask = pdb > stats["floor_db"] + THRESH_DB
            peak_db = float(pdb.max())
            # FSK/continuous bursts: close gaps shorter than 40 us and look for long solid runs.
            closed = np.convolve(mask.astype(np.float32), np.ones(40, dtype=np.float32), mode="same") > 0
            ce = np.flatnonzero(np.diff(closed.astype(np.int8))) + 1
            cb = np.concatenate([[0], ce, [closed.size]])
            for i in range(len(cb) - 1):
                s, e = int(cb[i]), int(cb[i + 1])
                if closed[s] and e - s >= 2000 and mask[s:e].mean() > 0.8:
                    _decode_fsk(x[s:e], float(pdb[s:e].max()) - stats["floor_db"], now)
            edges = np.flatnonzero(np.diff(mask.astype(np.int8))) + 1
            bounds = np.concatenate([[0], edges, [mask.size]])
            runs = [(bool(mask[bounds[i]]), int(bounds[i + 1] - bounds[i])) for i in range(len(bounds) - 1)]
            if carry is not None and runs and runs[0][0] == carry[0]:
                runs[0] = (carry[0], carry[1] + runs[0][1])
            elif carry is not None:
                runs.insert(0, carry)
            carry = runs.pop() if runs else None
            us = 1e6 / FS
            low_before = 0.0
            for level, length in runs:
                dur = length * us
                if level:
                    if dur >= MIN_PULSE_US:
                        frame.append((dur, low_before))
                    low_before = 0.0
                else:
                    low_before += dur
                    if low_before >= FRAME_GAP_US and frame:
                        _decode(frame, peak_db - stats["floor_db"], now)
                        frame = []
            if carry is not None and not carry[0] and carry[1] * us >= FRAME_GAP_US and frame:
                _decode(frame, peak_db - stats["floor_db"], now)
                frame = []
        
            for k in [k for k, d in devices.items() if now - d["last"] > 600.0]:
                devices.pop(k)
            if now - last_publish < 0.5:
                return
            last_publish = now
            devs = sorted(devices.values(), key=lambda d: -d["last"])[:MAX_DEVICES]
            ctx.env["ook"] = {
                "buffers": stats["buffers"], "bursts": stats["bursts"], "decoded": stats["decoded"],
                "floor_db": round(stats["floor_db"], 1), "threshold_db": THRESH_DB,
                "frames": frames,
                "devices": [dict(code=d["code"][:24], bits=d["bits"], mod=d["mod"], count=d["count"], rssi=d["rssi"],
                                 short=d["short_us"], long=d["long_us"], kind=d["kind"],
                                 last=time.strftime("%H:%M:%S", time.localtime(d["last"]))) for d in devs],
            }
      file: ''
      inputCount: 1
      outputCount: 0
      outputTensorSpecs: []
      throttled: false
    input:
      input0: '${graph.ook_rx.output.signal}'
    meta:
      node:
        x: 296
        y: 790
        width: 396
        height: 555
