  - name: subghz_finder
    module: python
    device: cpu
    runtime: python
    provider: generic
    config:
      source: editor
      code: |
        import time
        import numpy as np
        
        # Sub-GHz ISM activity map for the 300-960 MHz sweep: per-band levels and a tracked list of
        # narrowband carriers labelled by the band they fall in.
        
        BANDS = [
            ("315 MHz remotes / TPMS", 300.0, 320.0),
            ("345 MHz security sensors", 340.0, 350.0),
            ("433 MHz ISM (remotes, sensors)", 433.05, 434.79),
            ("FRS / GMRS", 462.5, 467.8),
            ("EU 868 ISM", 863.0, 870.0),
            ("Z-Wave US 908.4 / 916", 908.0, 916.5),
            ("US 915 ISM (LoRa, FHSS)", 902.0, 928.0),
        ]
        THRESH_DB = 16.0
        MIN_BINS = 2
        MAX_BW_HZ = 600e3
        TRACK_TTL_S = 120.0
        
        tracks = {}
        sweeps = 0
        last_fp = None
        last_publish = 0.0
        reset_seen = None
        
        
        def _band(f):
            for name, lo, hi in BANDS:
                if lo <= f <= hi:
                    return name
            return "other"
        
        
        def compute(ctx):
            global sweeps, last_fp, last_publish
            global reset_seen
            tok = (ctx.env.get("lab_control", {}) or {}).get("reset_all", 0)
            if reset_seen is None:
                reset_seen = tok
            elif tok != reset_seen:
                reset_seen = tok
                tracks.clear(); sweeps = 0
            x = np.asarray(ctx.inputs[0]).reshape(-1)
            attrs = ctx.input_attrs[0]
            fc = float(attrs["frequency"]) if "frequency" in attrs else 0.0
            fs = float(attrs["sampleRate"]) if "sampleRate" in attrs else 0.0
            n = x.size
            now = time.time()
            fp = (n, float(np.abs(x[:128]).sum()))
            if fp == last_fp or fs <= 0 or n < 16:
                return
            last_fp = fp
            sweeps += 1
            pwr = 20.0 * np.log10(np.abs(np.fft.fftshift(np.fft.fft(x))) / n + 1e-12)
            freqs = (fc + (np.arange(n) - n / 2.0) * (fs / n)) / 1e6
            bin_hz = fs / n
            band_rows = []
            for name, lo, hi in BANDS:
                m = (freqs >= lo) & (freqs <= hi)
                if not m.any():
                    continue
                p = pwr[m]
                nf = float(np.percentile(p, 30))
                band_rows.append(dict(band=name, range="%.1f-%.1f" % (lo, hi), peak="%.1f" % p.max(), noise="%.1f" % nf,
                                      occ="%.0f" % (100.0 * np.mean(p > nf + 8.0)), peak_mhz="%.3f" % freqs[m][int(np.argmax(p))]))
            noise = float(np.percentile(pwr, 30))
            above = pwr > noise + THRESH_DB
            edges = np.flatnonzero(np.diff(above.astype(np.int8)))
            starts = list(edges[above[edges + 1]] + 1) if edges.size else []
            ends = list(edges[~above[edges + 1]] + 1) if edges.size else []
            if above[0]:
                starts = [0] + starts
            if above[-1]:
                ends = ends + [n]
            seen = set()
            for s, e in zip(starts, ends):
                bw = (e - s) * bin_hz
                if bw > MAX_BW_HZ or (e - s) < MIN_BINS:
                    continue
                seg = pwr[s:e]
                w = 10 ** (seg / 10.0)
                f0 = float(np.sum(freqs[s:e] * w) / np.sum(w))
                key = round(f0 * 10) / 10.0
                tr = tracks.setdefault(key, dict(seen=0, first_sweep=sweeps))
                tr.update(freq=f0, peak=float(seg.max()), snr=float(seg.max() - noise), bw_khz=bw / 1e3, last=now,
                          seen=tr["seen"] + 1, band=_band(f0))
                seen.add(key)
            for k in [k for k, t in tracks.items() if now - t["last"] > TRACK_TTL_S]:
                tracks.pop(k)
            if now - last_publish < 0.5:
                return
            last_publish = now
            rows = []
            for k, t in tracks.items():
                duty = t["seen"] / max(1, sweeps - t["first_sweep"] + 1)
                rows.append(dict(freq="%.3f" % t["freq"], band=t["band"], peak="%.1f" % t["peak"], snr="%.1f" % t["snr"],
                                 bw="%.0f" % t["bw_khz"], duty="%.0f" % (100 * duty), active="YES" if k in seen else "no",
                                 last=time.strftime("%H:%M:%S", time.localtime(t["last"])), _k=-t["snr"]))
            rows.sort(key=lambda r: r["_k"])
            for r in rows:
                r.pop("_k")
            ctx.env["subghz"] = {"sweeps": sweeps, "noise_dbfs": round(noise, 1), "span": "%.0f-%.0f MHz" % (freqs[0], freqs[-1]),
                                 "carriers_now": len(seen), "bands": band_rows, "carriers": rows[:15]}
      file: ''
      inputCount: 1
      outputCount: 0
      outputTensorSpecs: []
      throttled: true
    input:
      input0: '${graph.subghz_sweep.output.signal}'
    meta:
      node:
        x: 1336
        y: 170
        width: 600
        height: 500
  - name: ism24_classifier
    module: python
    device: cpu
    runtime: python
    provider: generic
    config:
      source: editor
      code: |
        import time
        import numpy as np
        
        # 2.4 GHz ISM classifier for the HackRF sweep: Zigbee channels 11-26, BLE advertising channels,
        # Wi-Fi 20 MHz blocks, and frequency-hopper statistics, from mean power per 1 MHz channel.
        
        THRESH_DB = 8.0
        HISTORY = 60
        hist = []
        sweeps = 0
        last_fp = None
        last_publish = 0.0
        reset_seen = None
        
        
        def compute(ctx):
            global sweeps, last_fp, last_publish
            global reset_seen
            tok = (ctx.env.get("lab_control", {}) or {}).get("reset_all", 0)
            if reset_seen is None:
                reset_seen = tok
            elif tok != reset_seen:
                reset_seen = tok
                hist.clear(); sweeps = 0
            x = np.asarray(ctx.inputs[0]).reshape(-1)
            attrs = ctx.input_attrs[0]
            fc = float(attrs["frequency"]) if "frequency" in attrs else 0.0
            fs = float(attrs["sampleRate"]) if "sampleRate" in attrs else 0.0
            n = x.size
            now = time.time()
            fp = (n, float(np.abs(x[:128]).sum()))
            if fp == last_fp or fs <= 0 or n < 16:
                return
            last_fp = fp
            sweeps += 1
            pwr = 20.0 * np.log10(np.abs(np.fft.fftshift(np.fft.fft(x))) / n + 1e-12)
            freqs = (fc + (np.arange(n) - n / 2.0) * (fs / n)) / 1e6
            f0 = int(np.floor(freqs[0]))
            nch = int(np.ceil(freqs[-1])) - f0
            idx = np.clip((freqs - f0).astype(int), 0, nch - 1)
            lin = 10.0 ** (pwr / 10.0)
            s = np.zeros(nch); c = np.zeros(nch)
            np.add.at(s, idx, lin); np.add.at(c, idx, 1.0)
            ch = 10.0 * np.log10(s / np.maximum(c, 1.0) + 1e-20)
            noise = float(np.percentile(ch, 30))
            active = ch > noise + THRESH_DB
            hist.append((active, ch))
            del hist[:-HISTORY]
            if now - last_publish < 0.5:
                return
            last_publish = now
            A = np.array([h[0] for h in hist]); P = np.array([h[1] for h in hist])
            occ = A.mean(axis=0); pk = P.max(axis=0)
            mhz = lambda i: f0 + i + 0.5
        
            def chan(f):
                i = int(f - f0)
                return i if 0 <= i < nch else None
        
            wifi = []
            wifi_mask = np.zeros(nch, dtype=bool)
            for wch, fw in ((1, 2412), (6, 2437), (11, 2462)):
                lo, hi = chan(fw - 9), chan(fw + 9)
                if lo is not None and hi is not None:
                    o = float(occ[lo:hi + 1].mean())
                    if o > 0.1:
                        wifi.append(dict(ch=wch, mhz=fw, occ="%.0f" % (100 * o), peak="%.1f" % pk[lo:hi + 1].max()))
                        wifi_mask[lo:hi + 1] = True
            zig = []
            for z in range(11, 27):
                fz = 2405 + 5 * (z - 11)
                i = chan(fz)
                if i is not None and occ[i] > 0.05:
                    zig.append(dict(ch=z, mhz=fz, occ="%.0f" % (100 * occ[i]), peak="%.1f" % pk[i],
                                    note="inside Wi-Fi block" if wifi_mask[i] else "clear"))
            ble = []
            for name, fb in (("adv 37", 2402), ("adv 38", 2426), ("adv 39", 2480)):
                i = chan(fb)
                if i is not None:
                    ble.append(dict(ch=name, mhz=fb, occ="%.0f" % (100 * occ[i]), peak="%.1f" % pk[i],
                                    note="inside Wi-Fi block" if wifi_mask[i] else "clear"))
            hop = np.flatnonzero((occ > 0.03) & (occ < 0.7))
            fixed = np.flatnonzero(occ >= 0.7)
            ctx.env["ism24"] = {
                "sweeps": sweeps, "noise_dbfs": round(noise, 1), "active_now": int(active.sum()),
                "fixed_channels": int(fixed.size), "hopper_channels": int(hop.size),
                "hopper_range": "%.0f-%.0f MHz" % (mhz(hop.min()) - 0.5, mhz(hop.max()) + 0.5) if hop.size else "--",
                "hops_per_sweep": round(float(A[:, hop].sum(axis=1).mean()), 1) if hop.size else 0.0,
                "zigbee": zig, "ble_adv": ble, "wifi": wifi,
            }
      file: ''
      inputCount: 1
      outputCount: 0
      outputTensorSpecs: []
      throttled: true
    input:
      input0: '${graph.ism24_sweep.output.signal}'
    meta:
      node:
        x: 3288
        y: 707
        width: 600
        height: 500
