  - name: ism915_watch
    module: python
    device: cpu
    runtime: python
    provider: generic
    config:
      source: editor
      code: |
        import time
        import numpy as np
        
        # 902-928 MHz burst watch on the XTRX 30.72 MS/s capture. Each buffer is spectrally segmented
        # into energy blocks; bandwidth classifies them (LoRa 125/250/500 kHz, narrow FSK such as Z-Wave
        # or 915 MHz sensors, wide FHSS), and blocks are tracked over time by centre frequency.
        
        NFFT = 65536
        THRESH_DB = 9.0
        MIN_BW_KHZ = 8.0
        TRACK_TTL_S = 120.0
        ZWAVE = ((908.42, "Z-Wave R2 40 kbps"), (908.40, "Z-Wave R1 9.6 kbps"), (916.00, "Z-Wave R3 100 kbps"))
        
        tracks = {}
        buffers = 0
        last_publish = 0.0
        noise_est = None
        hops = []            # (time, freq_mhz) of narrow one-off bursts
        reset_seen = None
        
        
        def _kind(bw_khz, f_mhz):
            for fz, name in ZWAVE:
                if abs(f_mhz - fz) < 0.06 and bw_khz < 150:
                    return name
            if 100 <= bw_khz <= 160:
                return "LoRa-like 125 kHz"
            if 200 <= bw_khz <= 300:
                return "LoRa-like 250 kHz"
            if 420 <= bw_khz <= 600:
                return "LoRa-like 500 kHz"
            if bw_khz < 100:
                return "narrow FSK/OOK (sensor, meter, remote)"
            if bw_khz > 1000:
                return "wideband (FHSS/DSSS)"
            return "unclassified %.0f kHz" % bw_khz
        
        
        def compute(ctx):
            global buffers, last_publish, noise_est
            global reset_seen
            ctl = ctx.env.get("lab_control", {}) or {}
            token = (ctl.get("reset_all", 0), ctl.get("reset_915", 0))
            if reset_seen is None:
                reset_seen = token
            elif token != reset_seen:
                reset_seen = token
                tracks.clear(); hops.clear(); buffers = 0
            raw = np.asarray(ctx.inputs[0])
            attrs = ctx.input_attrs[0]
            fc = float(attrs["frequency"]) if "frequency" in attrs else 915e6
            fs = float(attrs["sampleRate"]) if "sampleRate" in attrs else 30.72e6
            flat = raw.reshape(-1)
            nb = max(1, flat.size // NFFT)
            n = NFFT
            now = time.time()
            buffers += 1
            win = np.hanning(n).astype(np.float32)
            blocks = flat[: nb * NFFT].reshape(nb, NFFT) * win[None, :]
            mag = np.abs(np.fft.fftshift(np.fft.fft(blocks, axis=1), axes=1)) / n
            pwr = 20.0 * np.log10(mag.max(axis=0) + 1e-12)          # max-hold over the batches in this buffer
            pwr = np.convolve(pwr, np.ones(8) / 8.0, mode="same")
            freqs = (fc + (np.arange(n) - n / 2.0) * (fs / n)) / 1e6
            bin_hz = fs / n
            nf = float(np.percentile(20.0 * np.log10(mag.mean(axis=0) + 1e-12), 30)) + 4.0   # floor of a max-hold
            noise_est = nf if noise_est is None else 0.95 * noise_est + 0.05 * nf
            above = pwr > noise_est + THRESH_DB
            above[: int(n * 0.02)] = False
            above[-int(n * 0.02):] = False
            dc = n // 2
            above[dc - 40: dc + 40] = False
            edges = np.flatnonzero(np.diff(above.astype(np.int8)))
            starts = list(edges[above[edges + 1]] + 1) if edges.size else []
            ends = list(edges[~above[edges + 1]] + 1) if edges.size else []
            if above[0]:
                starts = [0] + starts
            if above[-1]:
                ends = ends + [n]
            seen = set()
            for s, e in zip(starts, ends):
                bw_khz = (e - s) * bin_hz / 1e3
                if bw_khz < MIN_BW_KHZ:
                    continue
                seg = pwr[s:e]
                w = 10 ** (seg / 10.0)
                f0 = float(np.sum(freqs[s:e] * w) / np.sum(w))
                key = round(f0 * 20) / 20.0
                tr = tracks.setdefault(key, dict(hits=0, first=now))
                tr.update(freq=f0, bw=bw_khz, peak=float(seg.max()), snr=float(seg.max() - noise_est), last=now,
                          hits=tr["hits"] + 1, kind=_kind(bw_khz, f0))
                seen.add(key)
                if bw_khz < 100:
                    hops.append((now, f0))
            hops[:] = [h for h in hops if now - h[0] < 60.0]
            for k in [k for k, t in tracks.items() if now - t["last"] > TRACK_TTL_S]:
                tracks.pop(k)
            if now - last_publish < 0.5:
                return
            last_publish = now
            rows = sorted(tracks.values(), key=lambda t: -t["last"])[:15]
            hf = np.array(sorted(set(round(h[1], 2) for h in hops)))
            spacing = float(np.median(np.diff(hf))) * 1e3 if hf.size > 3 else 0.0
            fhss = {"bursts_per_min": len(hops), "channels_seen": int(hf.size),
                    "range": "%.2f-%.2f MHz" % (hf.min(), hf.max()) if hf.size else "--",
                    "spacing_khz": round(spacing, 0),
                    "verdict": ("FHSS network active (%d channels in 60 s)" % hf.size) if hf.size >= 6 else
                               ("sporadic narrow bursts" if hf.size else "quiet")}
            ctx.env["ism915"] = {
                "buffers": buffers, "noise_dbfs": round(noise_est, 1), "span": "%.1f-%.1f MHz" % (freqs[0], freqs[-1]),
                "blocks_now": len(seen),
                "fhss": fhss,
                "blocks": [dict(freq="%.3f" % t["freq"], bw="%.0f" % t["bw"], peak="%.1f" % t["peak"], snr="%.1f" % t["snr"],
                                hits=t["hits"], kind=t["kind"], last=time.strftime("%H:%M:%S", time.localtime(t["last"])))
                           for t in rows],
            }
      file: ''
      inputCount: 1
      outputCount: 0
      outputTensorSpecs: []
      throttled: true
    input:
      input0: '${graph.ism915_rx.output.signal}'
    meta:
      node:
        x: 3292
        y: 170
        width: 600
        height: 500
