    provider: generic
    config:
      content: |-
        ## 4. Select, visualize, and listen
        The **Slice** setting **[:, 1, :]** keeps every batch and sample and picks channel 1. Its output has shape **[8, 800]**. Channel numbering starts at zero, so channel 1 is the -400 kHz filter, or 96.5 MHz with the default tuning.
        
        The display branch uses **Spectrum Engine** to window the signal, compute a centered spectrum, apply automatic gain, convert to decibels, and scale for the **Waterfall**. What you see is the reconstructed channel after overlap-add.
        
        The sound branch demodulates the same channel with the **FM Demodulator** at 200 kHz. The **Audio** block resamples that to 48 kHz for your speakers. **Volume** starts at 0, so drag it up.
        
        **Try it:** change **Slice** to **[:, 0, :]** to pick the +400 kHz channel. The audio and the waterfall switch together because they share the slice. Restore **[:, 1, :]** to return.
