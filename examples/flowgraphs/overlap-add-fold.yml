        # Overlap-Add-Fold
        **The Filter block from Multi-FM Receiver, opened up so you can see every step.**
        
        This graph does the same job as the **Multi-FM Receiver** example: capture 2 MHz of the FM band, cut two stations out of it, and play one. The difference is that nothing is hidden. Every stage that the Filter block bundles is a separate block here, laid out left to right, with a numbered note beside it.
        
        1. Open the **Device** dropdown on the **Soapy SDR** block and choose your radio.
        2. Leave **Frequency** at 96.900 MHz for now. The two stations this graph expects sit at 96.5 and 97.3 MHz. Retune to a center that has stations 400 kHz either side of it in your city.
        3. Drag **Volume** up on the **Audio** block. It starts at 0.

        **Radio not listed?** Check the cable and plug the dongle directly into the computer rather than a hub. Close any other program that is using it, only one program can open a radio at a time. Then reopen this example from the **Flowgraph** menu under **Open Examples** so the list is rebuilt. On Linux, the kernel's DVB-T driver can claim an RTL-SDR before SoapySDR sees it. On Windows, the dongle needs the WinUSB driver installed with Zadig.
        
        ## How to read the canvas
        The upper row prepares the two filters and never touches the radio. The lower row carries radio samples. They meet at **Multiply**, where filtering actually happens, and everything after that is shared. Follow the four numbered notes in order. Each one ends with a link if you want the theory behind it.
        
        Hover over any wire to see the shape of the tensor flowing through it. The notes quote those shapes, so you can check them as you go.
        
        **Next:** open **Multi-FM Receiver** to use the same pipeline as one block, or **Simple FM Receiver** for the one-station version.
