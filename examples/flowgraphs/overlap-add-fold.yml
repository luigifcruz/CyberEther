    config:
      content: |-
        ## 2. Fast convolution and folding
        The two forward **FFT** blocks transform the padded samples and the padded filters. Multiplying their spectra applies each filter in the frequency domain, which is far cheaper than sliding 101 taps across every sample.
        
        **Expand Dims** inserts a channel dimension into the radio tensor, turning **[8, 8100]** into **[8, 1, 8100]**. **Multiply** broadcasts that against the **[2, 8100]** filter tensor to produce **[8, 2, 8100]**: eight batches, two channels, 8100 frequency bins. The singleton channel dimension lets both filters share one input without duplicating the radio.
        
        ### Folding
        The **Fold** block collapses **8100 bins to 810**, a factor of 10. It sums bins that sit 810 positions apart and divides by 10. In the time domain that is downsampling from 2 MHz to 200 kHz, and the inverse **FFT** that follows only has 810 values per channel to process.
        
        Filtering comes first on purpose. Anything outside the 200 kHz passband would otherwise fold on top of the station.
        
        The centers at plus and minus 400 kHz are whole multiples of the new 200 kHz sample rate, so both stations land at zero frequency after folding with **Offset** at 0. Other centers would need a frequency shift or a folding offset.
        
        **Further reading:** the [broadcasting guide from NumPy](https://numpy.org/doc/stable/user/basics.broadcasting.html) covers singleton dimensions, and the [downsampling and aliasing theorem](https://www.dsprelated.com/freebooks/sasp/Downsampling_Aliasing.html) covers folding.
    meta:
