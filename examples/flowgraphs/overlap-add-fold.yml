    config:
      content: |-
        ## 3. Unpadding and overlap-add
        The inverse transform returns **810 time samples** per channel and batch. After downsampling by 10, the 100 sample convolution tail has become **10 samples**. **Unpad** splits each result into **800 main samples** and a **10 sample tail** along **axis 2**.
        
        That tail is not padding to throw away. It holds real filtered signal that belongs at the start of the next batch. **Overlap Add** adds the previous batch's tail to the start of the current one and saves the new tail for the next compute cycle, keeping separate state for each channel.
        
        The output shape is **[8, 2, 800]**. This stitches the filtered stream back together across batch boundaries. Without it you would hear a click at every batch edge and see a seam in the waterfall.
        
        **Further reading:** the [overlap-add explanation on Wikipedia](https://en.wikipedia.org/wiki/Overlap%E2%80%93add_method) shows how the tails combine.
    meta:
