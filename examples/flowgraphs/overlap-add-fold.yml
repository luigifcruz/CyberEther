      content: |-
        ## 1. Filter design and padding
        The **Filter Taps** block designs two finite impulse response filters, each with **101 taps** and a **Bandwidth** of 200 kHz, at the radio's 2 MHz sample rate. The two **Center** values, 0.4 and -0.4 MHz, are offsets from the tuned frequency. With the radio at 96.9 MHz the filters select 97.3 and 96.5 MHz. The coefficient tensor has shape **[2, 101]**, one row per filter.
        
        ### Why pad
        Each radio batch holds **8000 samples**. Convolving it with a 101 tap filter produces **8000 + 101 - 1 = 8100** samples. The extra 100 positions hold the filter's tail, the part of the response that spills past the end of the batch.
        
        - **Radio samples:** 8000 samples plus 100 zeros gives an 8100 point transform.
        - **Each filter:** 101 taps plus 7999 zeros gives an 8100 point transform.
        
        Both **Pad** blocks work on **axis 1**. The radio tensor becomes **[8, 8100]** and the filter tensor becomes **[2, 8100]**, so their sample dimensions match for the multiplication ahead.
        
        **Remember:** padding makes room for linear convolution. Without it, a transform based convolution wraps the tail around to the beginning of the same batch.
        
        **Further reading:** the [filtering chapter in PySDR](https://pysdr.org/content/filters.html) explains taps, bandwidth, and frequency response.
    meta:
