description: Uses the Filter block to separate two FM stations from one RTL-SDR input. Displays both spectra and plays audio from one station.
graph:
  - name: not34
    module: note
    device: cpu
    runtime: native
    provider: generic
    config:
      content: |-
        # Multi-FM Receiver
        **One radio, one 2 MHz capture, two stations pulled out of it at once.**
        
        1. Plug in your SDR and choose it in the **Device** dropdown on the **Soapy SDR** block.
        2. Leave **Frequency** at 96.900 MHz for now. The two stations this graph expects sit 400 kHz below and above it, at 96.5 and 97.3 MHz.
        3. Drag **Volume** up on the **Audio** block. It starts at 0 so the graph is silent until you ask for sound.

        **Radio not listed?** Check the cable and plug the dongle directly into the computer rather than a hub. Close any other program that is using it, only one program can open a radio at a time. Then reopen this example from the **Flowgraph** menu under **Open Examples** so the list is rebuilt. On Linux, the kernel's DVB-T driver can claim an RTL-SDR before SoapySDR sees it. On Windows, the dongle needs the WinUSB driver installed with Zadig.
        
        ## How it works
        The **Simple FM Receiver** example captures only 240 kHz, enough for one station. This one captures 2 MHz, which holds about ten broadcast channels, and lets the **Filter** block cut two of them out. Each cut is called a head. The filter shifts each head down to center, keeps 200 kHz of it, and lowers the sample rate to match, so what comes out is exactly what a single station receiver would have captured on its own.
        
        The output carries both heads stacked side by side. Each **Slice** block picks one. The top slice feeds the **FM Demodulator** and the **Audio** block, so that is the station you hear. Both slices also feed their own **Spectrum Analyzer** so you can see the two stations at once.
        
        ## What you are looking at
        The large **Spectrum Analyzer** shows the raw 2 MHz. Every hump about 200 kHz wide is a station. The two small analyzers each show one 200 kHz head. Their axis labels still read 96.9 MHz because the filter reports the new sample rate but not the new center, so read them as windows around 96.5 and 97.3 MHz.
        
        ## Tune it to your city
        Find two stations in the big plot that are the same distance either side of some center point, retune **Frequency** to that center, and set the two **Center** offsets on the **Filter** block to the signed distances. Station humps show up in the big plot as soon as you retune, so you can hunt by eye.
        
        **Next:** open **Overlap-Add-Fold** to see the filtering and resampling steps this block bundles, laid out one by one.
    meta:
      node:
        x: 14
        y: 499
        width: 359
        height: 373
        configCollapsed: false
  - name: not44
    module: note
    device: cpu
    runtime: native
    provider: generic
    config:
      content: |-
        # The Filter block
        **Heads**, **Center**, and **Bandwidth** describe what to cut out. **Taps** describes how sharply.
        
        - **Center** lists one offset per head, in MHz from the tuned frequency. Positive is above, negative is below. Here it reads 0.4 and -0.4.
        - **Bandwidth** is how much each head keeps. Broadcast FM needs 200 kHz.
        - **Taps** sets the sharpness of the cut. More taps reject neighbors better and cost more compute. The count must be odd.
        
        ## Adding a third station
        Raise **Heads** to 3 and add a third offset to **Center**. Any station inside the 2 MHz capture is fair game, so the offsets must stay between -1 and 1 MHz. Then add a **Slice** for index 2 and a **Spectrum Analyzer** to watch it.
        
        ## The resampling rule
        The block lowers the sample rate by **Sample Rate** divided by **Bandwidth**, which must come out as a whole number. Here 2 MHz over 200 kHz is 10. The number of taps minus one must also divide evenly by that number, which is why 51 taps works. Break either rule and the block skips resampling, the output stays at 2 MHz, and the **FM Demodulator** and **Audio** blocks downstream no longer match. Look for a warning in the console if the sound turns to noise after an edit.
    meta:
      node:
        x: 414
        y: 165
        width: 314
        height: 231
        configCollapsed: false
  - name: note
    module: note
    device: cpu
    runtime: native
    provider: generic
    config:
      content: |-
        # Picking a station
        The filter output has three dimensions: batches, heads, and samples. A **Slice** keeps everything along two of them and one index along the head dimension. The top **Slice** reads index 0 and the bottom one reads index 1. That is the whole difference between them.
        
        ## Hear the other station
        Change the top slice from index 0 to index 1 and the **FM Demodulator** now plays the second station. Change it back to return.
        
        ## Contiguous
        Leave **Contiguous** on. Downstream blocks want the selected head packed into its own buffer rather than a view with gaps.
        
        ## Sample rates downstream
        After the filter each head runs at 200 kHz. The **FM Demodulator** and the **Audio** block are both set to 200 kHz to match. Change **Bandwidth** on the filter and you must change both of those too.
    meta:
      node:
