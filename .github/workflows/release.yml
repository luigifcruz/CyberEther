name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate-version:
    name: validate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F"'" '/^[[:space:]]*version:/ { print $2; exit }' meson.build)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid project version in meson.build: %s\n' "$version" >&2
            exit 1
          fi
          printf 'PROJECT_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Validate release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="v${PROJECT_VERSION}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            printf 'Release tag %s does not match project version %s. Expected %s.\n' \
              "$GITHUB_REF_NAME" "$PROJECT_VERSION" "$expected_tag" >&2
            exit 1
          fi
          printf 'Validated release version %s (%s).\n' "$PROJECT_VERSION" "$GITHUB_REF_NAME"

  prepare-release:
    needs: validate-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Prepare release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .dist
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json body \
              --jq .body > .dist/release-notes.md
          else
            : > .dist/release-notes.md
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cyberether-release-notes
          path: .dist/release-notes.md

  linux:
    needs: prepare-release
    uses: ./.github/workflows/linux.yml
    with:
      package_desktop: true

  wheel:
    needs: prepare-release
    uses: ./.github/workflows/wheel.yml

  windows:
    needs: prepare-release
    uses: ./.github/workflows/windows.yml
    with:
      package_desktop: true

  macos:
    needs: prepare-release
    uses: ./.github/workflows/macos.yml
    with:
      package_desktop: true
    secrets: inherit

  emscripten:
    needs: prepare-release
    uses: ./.github/workflows/emscripten.yml

  containers:
    needs: prepare-release
    uses: ./.github/workflows/container.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: ${{ github.event_name == 'push' }}

  github-release:
    if: github.event_name == 'push'
    needs: [linux, wheel, windows, macos, emscripten]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: 'cyberether-bin-linux-*'
          path: .dist/artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: 'superluminal-wheel-manylinux-*'
          path: .dist/artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: 'cyberether-release-linux-*'
          path: .dist/artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v4.3.0
        with:
          name: cyberether-bin-windows-x86_64
          path: .dist/artifacts

      - uses: actions/download-artifact@v4.3.0
        with:
          name: cyberether-release-windows-x86_64
          path: .dist/artifacts

      - uses: actions/download-artifact@v4.3.0
        with:
          name: cyberether-bin-macos-arm64
          path: .dist/artifacts

      - uses: actions/download-artifact@v4.3.0
        with:
          name: cyberether-release-macos-arm64
          path: .dist/artifacts

      - uses: actions/download-artifact@v4.3.0
        with:
          name: cyberether-bin-emscripten-wasm32
          path: .dist/artifacts

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            .dist/artifacts/* \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
