name: CI

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    uses: ./.github/workflows/linux.yml

  windows:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/windows.yml

  macos:
    uses: ./.github/workflows/macos.yml

  emscripten:
    uses: ./.github/workflows/emscripten.yml
